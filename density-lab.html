<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>밀도 실험대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* 레이아웃: 화면 전체가 나무 실험대(3D), 위에 머리글·단계 탭, 오른쪽 설명란, 왼쪽 아래 조작 막대 */
:root{
  --bg:#1d1a17; --ink:#f4efe7; --ink2:#c9c0b3; --mute:#9a9083;
  --panel:rgba(27,24,21,.88); --panel2:rgba(255,255,255,.06); --line:rgba(255,255,255,.12);
  --accent:#f0b65e; --water:#7cc6f0; --ok:#86d69c; --warn:#ff9a7a;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"Share Tech Mono",ui-monospace,Consolas,monospace;
  --pw:356px;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-50%);font-size:12px;font-weight:600;color:var(--ink);background:rgba(22,19,16,.74);border:1px solid var(--line);padding:2px 8px;border-radius:7px;white-space:nowrap;letter-spacing:.01em}
.lbl small{font-family:var(--mono);font-weight:400;color:var(--accent);margin-left:4px;font-size:12px}
.lbl.pop{font-size:14px;padding:4px 10px;border-color:transparent;animation:pop 1.8s ease forwards}
.lbl.float{background:#2f6b8f}.lbl.sink{background:#8a4a2c}
.lbl.card{font-weight:500;line-height:1.5;padding:7px 11px;text-align:left;background:rgba(18,16,14,.9);border-color:rgba(240,182,94,.5)}
.lbl.card b{font-family:var(--mono);color:var(--accent);font-size:14px;font-weight:400}
@keyframes pop{0%{opacity:0;margin-top:8px}12%{opacity:1;margin-top:0}80%{opacity:1}100%{opacity:0;margin-top:-10px}}

header{position:fixed;left:0;right:0;top:0;padding:10px max(16px,env(safe-area-inset-left,0px)) 0;display:flex;align-items:center;gap:14px;z-index:5;pointer-events:none}
header>*{pointer-events:auto}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--ink2)}
.hbtns{margin-left:auto;display:flex;gap:8px}
.btn{font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;backdrop-filter:blur(8px)}
.btn:hover{border-color:rgba(240,182,94,.6)}
.btn:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:#2a1d0c;border-color:transparent}
#tabs{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:62px;display:flex;gap:6px;z-index:5;flex-wrap:wrap;max-width:calc(100vw - var(--pw) - 48px)}
body.embed #tabs{top:10px}
.tab{font:inherit;font-size:13.5px;font-weight:600;color:var(--ink2);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;backdrop-filter:blur(8px)}
.tab[aria-selected="true"]{background:var(--ink);color:#1d1a17;border-color:transparent}
body.embed header{display:none}

#panel{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:12px;bottom:14px;width:var(--pw);background:var(--panel);border:1px solid var(--line);border-radius:16px;z-index:6;display:flex;flex-direction:column;backdrop-filter:blur(12px);transition:transform .35s ease,opacity .35s}
body:not(.embed) #panel{top:60px}
#panel.closed{transform:translateX(calc(100% + 30px));opacity:0;pointer-events:none}
.phead{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
.phead h2{margin:0;font-size:17px;font-weight:700;text-wrap:balance}
.phead .btn{margin-left:auto;padding:5px 10px;font-size:12px}
#pbody{overflow-y:auto;padding:0 16px 16px;display:flex;flex-direction:column;gap:12px;font-size:13.5px;line-height:1.6;color:var(--ink2)}
#pbody p{margin:0}
#pbody b{color:var(--ink)}
.mission{background:rgba(240,182,94,.1);border:1px solid rgba(240,182,94,.35);border-radius:12px;padding:10px 12px}
.mission h3{margin:0 0 6px;font-size:13px;color:var(--accent);letter-spacing:.04em}
.mission ol{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.mission li{position:relative;padding-left:22px}
.mission li::before{content:"";position:absolute;left:0;top:4px;width:14px;height:14px;box-sizing:border-box;border-radius:4px;border:1.5px solid var(--mute)}
.mission li.done{color:var(--ink)}
.mission li.done::before{background:var(--ok);border-color:var(--ok)}
.box{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.box.concl{border-color:rgba(134,214,156,.45);background:rgba(134,214,156,.08)}
.box.concl b{color:var(--ok)}
.note{font-size:11.5px;color:var(--mute);line-height:1.5}
table.rec{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
table.rec th{font-weight:600;color:var(--mute);text-align:right;padding:4px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
table.rec td{text-align:right;padding:5px 4px;border-bottom:1px solid rgba(255,255,255,.05);font-family:var(--mono);font-size:13.5px;color:var(--ink)}
table.rec th:first-child,table.rec td:first-child{text-align:left;font-family:var(--font);font-size:12.5px}
table.rec td.hl{color:var(--accent)}
table.grid td{text-align:center;font-family:var(--font);font-size:12.5px}
table.grid th{text-align:center}
.f{color:#8fd0f5}.s{color:#f0a27e}
canvas.chart{width:100%;height:auto;display:block;border-radius:10px;background:rgba(0,0,0,.18)}
.read{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px}
.read span:nth-child(even){font-family:var(--mono);font-size:15px;color:var(--ink);text-align:right}
#pfoot{padding:8px 16px 12px;font-size:11px;color:var(--mute);border-top:1px solid var(--line)}
#popen{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:60px;z-index:6;display:none}
body.embed #popen{top:12px}
#popen.show{display:block}

#bar{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:5;flex-wrap:wrap;max-width:calc(100vw - var(--pw) - 50px)}
#credit{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));font-size:11px;color:rgba(244,239,231,.55);z-index:5;pointer-events:none}
#toast{position:fixed;left:calc((100vw - var(--pw)) / 2);top:110px;transform:translateX(-50%);background:rgba(18,16,14,.92);border:1px solid var(--line);color:var(--ink);padding:9px 16px;border-radius:12px;font-size:14px;z-index:8;opacity:0;transition:opacity .3s;pointer-events:none;max-width:min(520px,calc(100vw - 32px));text-align:center;line-height:1.5}
#toast.show{opacity:1}
body.embed #toast{top:56px}
#flash{position:fixed;inset:0;z-index:9;pointer-events:none;display:grid;place-items:center;opacity:0;background:radial-gradient(circle at center,rgba(255,230,160,.42),rgba(255,230,160,0) 60%)}
#flash span{font-size:64px;font-weight:700;color:#fff;text-shadow:0 4px 30px rgba(240,160,40,.8);transform:scale(.7)}
#flash.on{animation:fl 1.6s ease}
#flash.on span{animation:fs 1.6s ease}
@keyframes fl{0%{opacity:0}15%{opacity:1}70%{opacity:1}100%{opacity:0}}
@keyframes fs{0%{transform:scale(.6)}20%{transform:scale(1.08)}35%{transform:scale(1)}100%{transform:scale(1)}}

.modal{position:fixed;inset:0;z-index:20;background:rgba(10,9,8,.6);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none!important}
.mcard{background:#24201c;border:1px solid var(--line);border-radius:16px;max-width:560px;width:100%;max-height:86vh;overflow:auto;padding:18px 20px;color:var(--ink2);font-size:14px;line-height:1.6}
.mcard h2{margin:0 0 10px;color:var(--ink);font-size:18px;display:flex;align-items:center}
.mcard h2 .btn{margin-left:auto}
.q{border-top:1px solid var(--line);padding:12px 0}
.q p{margin:0 0 8px;color:var(--ink)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{font:inherit;font-size:13px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:6px 11px;cursor:pointer}
.opt.right{background:rgba(134,214,156,.2);border-color:var(--ok)}
.opt.wrong{background:rgba(255,154,122,.15);border-color:var(--warn)}
.exp{margin-top:8px;font-size:13px;color:var(--ink2)}
#qrbox{display:grid;place-items:center;padding:12px;background:#fff;border-radius:12px;width:max-content;margin:6px auto}
#qrurl{word-break:break-all;font-size:12px;text-align:center;color:var(--mute)}

@media (max-width:760px){
  :root{--pw:0px}
  .brand h1{font-size:18px}.brand span{display:none}
  #tabs{top:52px;max-width:calc(100vw - 32px);flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .tab{font-size:12.5px;padding:6px 11px;flex:none}
  #panel{left:10px;right:10px;width:auto;top:auto;bottom:10px;height:52vh;border-radius:16px}
  body:not(.embed) #panel{top:auto}
  #panel.closed{transform:translateY(calc(100% + 30px))}
  #popen{top:auto;bottom:calc(30px + env(safe-area-inset-bottom,0px));right:14px}
  body.embed #popen{top:auto}
  #bar{max-width:calc(100vw - 130px)}
  #toast{left:50%;top:96px}
  .btn{padding:7px 10px;font-size:12.5px}
}
@media (prefers-reduced-motion:reduce){#flash.on,#flash.on span,.lbl.pop{animation-duration:.01s}}
</style>

</head>
<body>
<div id="stage"></div>
<div id="labels"></div>
<header>
  <div class="brand"><h1>밀도 실험대</h1><span>중2 과학 Ⅰ. 물질의 특성 · 밀도와 밀도 차를 이용한 분리</span></div>
  <div class="hbtns"><button class="btn" id="bQuiz" type="button">확인 문제</button><button class="btn" id="bQR" type="button">QR</button></div>
</header>
<nav id="tabs" role="tablist"></nav>
<aside id="panel">
  <div class="phead"><h2 id="ptitle"></h2><button class="btn" id="pclose" type="button">접기</button></div>
  <div id="pbody"></div>
  <div id="pfoot">made by 한광여중 이상민</div>
</aside>
<button class="btn" id="popen" type="button">설명 보기</button>
<div id="bar"></div>
<div id="credit">made by 한광여중 이상민</div>
<div id="toast"></div>
<div id="flash"><span>성공!</span></div>
<div class="modal" id="mQuiz" hidden><div class="mcard"><h2>확인 문제 <button class="btn" data-close type="button">닫기</button></h2><div id="quiz"></div></div></div>
<div class="modal" id="mQR" hidden><div class="mcard" style="max-width:340px"><h2>휴대폰으로 열기 <button class="btn" data-close type="button">닫기</button></h2><div id="qrbox"></div><div id="qrurl"></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const V3=THREE.Vector3;
const params=new URLSearchParams(location.search);
const EMBED=params.get('embed')==='1';
if(EMBED) document.body.classList.add('embed');
const TABS=[
  {id:'A',name:'① 질량과 부피'},
  {id:'B',name:'② 뜨고 가라앉음'},
  {id:'C',name:'③ 소금물과 달걀'},
  {id:'D',name:'④ 플라스틱 분리'},
  {id:'E',name:'⑤ 분별 깔때기'}
];
const SX={A:0,B:95,C:190,D:285,E:380};
const scParam=(params.get('sc')||'').toUpperCase();
let tab=SX[scParam]!==undefined?scParam:'A';
const isMobile=()=>innerWidth<=760;

/* ---------- 렌더러·장면 ---------- */
const stage=$('#stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.08;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x2b2621);
scene.fog=new THREE.Fog(0x2b2621,160,320);
const camera=new THREE.PerspectiveCamera(36,1,0.5,1200);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=0.08;controls.enablePan=false;
controls.minPolarAngle=0.2;controls.maxPolarAngle=1.45;controls.minDistance=12;controls.maxDistance=280;
controls.minAzimuthAngle=-1.15;controls.maxAzimuthAngle=1.15;controls.rotateSpeed=0.7;

function canvasTex(w,h,draw,srgb=true){
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);
  const t=new THREE.CanvasTexture(c);if(srgb)t.encoding=THREE.sRGBEncoding;t.anisotropy=renderer.capabilities.getMaxAnisotropy();t.userData={c,g,draw};return t;
}
/* 주기적 값 잡음 */
function makeNoise(seed){
  const P=new Uint8Array(512);let s=seed||7;
  for(let i=0;i<256;i++)P[i]=i;
  for(let i=255;i>0;i--){s=(s*16807)%2147483647;const j=s%(i+1);[P[i],P[j]]=[P[j],P[i]];}
  for(let i=0;i<256;i++)P[i+256]=P[i];
  const R=new Float32Array(256);for(let i=0;i<256;i++){s=(s*16807)%2147483647;R[i]=s/2147483647;}
  const sm=t=>t*t*(3-2*t);
  return function(x,y,px,py){
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const x0=((xi%px)+px)%px,x1=(x0+1)%px,y0=((yi%py)+py)%py,y1=(y0+1)%py;
    const h=(a,b)=>R[P[(P[a&255]+b)&255]];
    const u=sm(xf),v=sm(yf);
    const a=h(x0,y0),b=h(x1,y0),c=h(x0,y1),d=h(x1,y1);
    return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
  };
}
function woodTexture(){
  const N=makeNoise(11);
  return canvasTex(1024,1024,(g,w,h)=>{
    const img=g.createImageData(w,h),d=img.data;
    for(let y=0;y<h;y++){
      const plank=Math.floor(y/256),py=y%256;
      for(let x=0;x<w;x++){
        const u=x/w,v=y/h;
        let n=0,a=1,f=1,tot=0;
        for(let o=0;o<3;o++){n+=a*N(u*3*f+plank*13.1,v*24*f,3*f,24*f);tot+=a;a*=.5;f*=2;}
        n/=tot;
        const grain=Math.sin((py/256*9+n*5.5+N(u*6,plank*3.3,6,4)*2)*Math.PI*2);
        let t=Math.pow(.5+.5*grain,2.2)*.55+N(u*40,v*180,40,180)*.25+n*.2;
        const seam=py<3||py>253?.55:1;
        const r=(150-t*62)*seam,gg=(98-t*44)*seam,b=(60-t*28)*seam;
        const i=(y*w+x)*4;d[i]=r;d[i+1]=gg;d[i+2]=b;d[i+3]=255;
      }
    }
    g.putImageData(img,0,0);
  });
}
function brushedTex(){
  return canvasTex(256,256,(g,w,h)=>{
    g.fillStyle='#888';g.fillRect(0,0,w,h);
    for(let i=0;i<900;i++){const y=Math.random()*h;const c=110+Math.random()*90|0;g.strokeStyle=`rgba(${c},${c},${c},.35)`;g.lineWidth=Math.random()*1.2+.3;g.beginPath();g.moveTo(0,y);g.lineTo(w,y+Math.random()*2-1);g.stroke();}
  },false);
}
function makeEnv(){
  const t=canvasTex(1024,512,(g,w,h)=>{
    const gr=g.createLinearGradient(0,0,0,h);
    gr.addColorStop(0,'#fffaf0');gr.addColorStop(.42,'#ddd5c8');gr.addColorStop(.52,'#8f8170');gr.addColorStop(1,'#2d251f');
    g.fillStyle=gr;g.fillRect(0,0,w,h);
    g.fillStyle='#ffffff';for(let i=0;i<4;i++)g.fillRect(70+i*250,120,130,105);
    g.fillStyle='rgba(255,250,232,.95)';g.fillRect(0,28,w,12);g.fillRect(0,70,w,6);
  });
  t.mapping=THREE.EquirectangularReflectionMapping;
  const pm=new THREE.PMREMGenerator(renderer);const env=pm.fromEquirectangular(t).texture;pm.dispose();return env;
}
scene.environment=makeEnv();

const hemi=new THREE.HemisphereLight(0xfff3e2,0x3b2b1f,.55);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff6ea,1.05);
sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-55,right:55,top:55,bottom:-55,near:10,far:200});
sun.shadow.bias=-0.0006;sun.shadow.radius=3;
scene.add(sun,sun.target);
const fill=new THREE.DirectionalLight(0xcfe2ff,.25);fill.position.set(-60,40,60);scene.add(fill);
function placeSun(sx){sun.position.set(sx+28,75,45);sun.target.position.set(sx,0,0);}

/* 실험대와 벽 */
const woodMap=woodTexture();woodMap.wrapS=woodMap.wrapT=THREE.RepeatWrapping;woodMap.repeat.set(4.2,.75);
const tableMat=new THREE.MeshStandardMaterial({map:woodMap,roughness:.62,metalness:0,envMapIntensity:.5});
const table=new THREE.Mesh(new THREE.BoxGeometry(520,4,84),tableMat);
table.position.set(190,-2,2);table.receiveShadow=true;scene.add(table);
const wallTex=canvasTex(1024,512,(g,w,h)=>{
  const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#4a4139');gr.addColorStop(1,'#2e2822');g.fillStyle=gr;g.fillRect(0,0,w,h);
  g.strokeStyle='rgba(0,0,0,.18)';g.lineWidth=2;for(let x=0;x<w;x+=64){g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke();}
  for(let y=0;y<h;y+=64){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke();}
});
wallTex.wrapS=wallTex.wrapT=THREE.RepeatWrapping;wallTex.repeat.set(6,1.2);
const wall=new THREE.Mesh(new THREE.PlaneGeometry(700,220),new THREE.MeshStandardMaterial({map:wallTex,roughness:.9}));
wall.position.set(190,40,-62);scene.add(wall);

/* ---------- 재질 ---------- */
const M={
  glass:new THREE.MeshPhysicalMaterial({color:0xffffff,metalness:0,roughness:.03,transparent:true,opacity:.15,clearcoat:1,clearcoatRoughness:.04,envMapIntensity:1.7,side:THREE.DoubleSide,depthWrite:false}),
  rim:new THREE.MeshPhysicalMaterial({color:0xeaf6ff,metalness:0,roughness:.05,transparent:true,opacity:.45,clearcoat:1,envMapIntensity:1.6,depthWrite:false}),
  steel:new THREE.MeshStandardMaterial({color:0xc9ccd0,metalness:.92,roughness:.28,roughnessMap:brushedTex()}),
  darkSteel:new THREE.MeshStandardMaterial({color:0x3b3e43,metalness:.85,roughness:.38}),
  plastic:new THREE.MeshStandardMaterial({color:0xecebe7,roughness:.45,metalness:0}),
  tray:new THREE.MeshStandardMaterial({color:0x2f3438,roughness:.7,metalness:.1}),
  hit:new THREE.MeshBasicMaterial({visible:false}),
  thread:new THREE.LineBasicMaterial({color:0xf2ede2})
};
function liquidMat(color,op){
  return new THREE.MeshPhysicalMaterial({color,transparent:true,opacity:op,roughness:.08,metalness:0,clearcoat:.5,envMapIntensity:.9,depthWrite:false,side:THREE.DoubleSide});
}
function shadowAll(o,cast=true,recv=true){o.traverse(m=>{if(m.isMesh&&m.material!==M.hit&&!(m.material&&m.material.transparent)){m.castShadow=cast;m.receiveShadow=recv;}});}

/* ---------- 라벨(HTML) ---------- */
const labels=[];
const labelBox=$('#labels');
function addLabel(html,anchor,off,station,cls){
  const el=document.createElement('div');el.className='lbl'+(cls?' '+cls:'');el.innerHTML=html;labelBox.appendChild(el);
  const L={el,anchor,off:off||new V3(),station,visible:true};labels.push(L);return L;
}

function popLabel(html,pos,station,cls){
  const L=addLabel(html,pos.clone(),new V3(),station,'pop '+(cls||''));setTimeout(()=>removeLabel(L),1800);
}
const _v=new V3();
function updateLabels(){
  const w=innerWidth,h=innerHeight;
  for(const L of labels){
    if(L.station!==tab||!L.visible){L.el.style.display='none';continue;}
    if(L.anchor.isObject3D)L.anchor.getWorldPosition(_v);else _v.copy(L.anchor);
    _v.add(L.off).project(camera);
    if(_v.z>1){L.el.style.display='none';continue;}
    L.el.style.display='';L.el.style.left=((_v.x+1)/2*w)+'px';L.el.style.top=((1-_v.y)/2*h)+'px';
  }
}

/* ---------- 트윈 ---------- */
const tweens=[];
const easeIO=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeOut=t=>1-Math.pow(1-t,3);
function tween(dur,fn,done,ease){const tw={t:0,dur,fn,done,ease:ease||easeIO};tweens.push(tw);return tw;}
function updTweens(dt){
  for(let i=tweens.length-1;i>=0;i--){
    const tw=tweens[i];tw.t+=dt;const k=Math.min(1,tw.t/tw.dur);tw.fn(tw.ease(k));
    if(k>=1){tweens.splice(i,1);if(tw.done)tw.done();}
  }
}
function moveTo(obj,to,dur,arc,done){
  const from=obj.position.clone();
  return tween(dur,k=>{obj.position.lerpVectors(from,to,k);obj.position.y+=Math.sin(k*Math.PI)*(arc||0);},done);
}

function gradTex(o){ // o: {cap, step, major, label, hcm}
  return canvasTex(256,2048,(g,w,h)=>{
    g.clearRect(0,0,w,h);
    g.fillStyle='rgba(255,255,255,.92)';g.strokeStyle='rgba(255,255,255,.92)';
    g.font='bold 54px "IBM Plex Sans KR",sans-serif';g.textBaseline='middle';
    for(let v=o.step;v<=o.cap+1e-6;v+=o.step){
      const y=h-(v/o.cap)*h*o.fill;
      const big=Math.abs(v%o.major)<1e-6||Math.abs(v%o.major-o.major)<1e-6;
      const mid=o.mid&&(Math.abs(v%o.mid)<1e-6||Math.abs(v%o.mid-o.mid)<1e-6);
      g.fillRect(8,y-(big?3:2),big?110:mid?78:48,big?6:4);
      if(big)g.fillText(String(Math.round(v)),126,y+2);
    }
    if(o.label){g.font='bold 46px "IBM Plex Sans KR",sans-serif';g.fillText(o.label,126,h-(1)*h*o.fill-60);}
  });
}
function makeBeaker(o){

  const foot=new THREE.Mesh(new THREE.TorusGeometry(o.r+wall-.05,.09,8,64),M.rim);foot.rotation.x=Math.PI/2;foot.position.y=.08;g.add(foot);
  if(o.cap){
    const area=Math.PI*o.r*o.r;const hFull=o.cap/area; // cap까지 높이
    const tex=gradTex({cap:o.cap,step:o.step||50,major:o.major||100,fill:1,label:null});
    const dh=hFull;
    const dec=new THREE.Mesh(new THREE.CylinderGeometry(o.r+wall+.012,o.r+wall+.012,dh,32,1,true,-.42,.84),new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:false,side:THREE.FrontSide}));
    dec.position.y=.32+dh/2;dec.renderOrder=5;g.add(dec);
  }
  const liq=new THREE.Mesh(new THREE.CylinderGeometry(o.r-.01,o.r-.01,1,64),liquidMat(o.color==null?0x8ecdf0:o.color,o.op||.4));liq.renderOrder=1;g.add(liq);
  const api={group:g,r:o.r,h:o.h,base:.32,area:Math.PI*o.r*o.r,liq,vol:0,
    setVol(v){this.vol=v;const hh=Math.max(.001,v/this.area);liq.scale.y=hh;liq.position.y=this.base+hh/2;liq.visible=v>.05;},
    surfaceY(){return this.group.position.y+this.base+this.vol/this.area;},
    floorY(){return this.group.position.y+this.base;}
  };
  api.setVol(o.vol||0);
  return api;
}

function makeZone(o){

const ray=new THREE.Raycaster();const ndc=new THREE.Vector2();
const dragPlane=new THREE.Plane(new V3(0,1,0),0);
let drag=null; // {it, target, rot}
function setNDC(e){const r=renderer.domElement.getBoundingClientRect();ndc.x=(e.clientX-r.left)/r.width*2-1;ndc.y=-(e.clientY-r.top)/r.height*2+1;}
function pickables(){const a=[];for(const it of items)if(it.station===tab&&!it.busy&&it.enabled!==false)a.push(it.hit);return a;}
function onDown(e){
  if(e.button>0||camAnim)return;
  setNDC(e);ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects(pickables(),false);
  if(!hits.length)return;
  let it=hits[0].object.userData.item;
  e.stopPropagation();e.preventDefault();
  // 물체를 잡는 동안에는 화면 회전을 멈춤(터치는 OrbitControls가 touchstart로 따로 받기 때문)
  controls.enabled=false;
  const reEnable=()=>{removeEventListener('pointerup',reEnable);removeEventListener('pointercancel',reEnable);if(!camAnim)controls.enabled=true;};
  addEventListener('pointerup',reEnable);addEventListener('pointercancel',reEnable);
  if(it.onClick){it.onClick(it);return;}
  if(it.spawn){it=it.spawn(it);if(!it)return;}
  if(it.rotate){drag={it,rot:true,last:screenAngle(e,it)};}
  else{
    if(it.onPick)it.onPick(it);
    it.state='drag';
    const gy=it.grabY||0;dragPlane.constant=-(it.lift+gy);
    const p=new V3();const okp=ray.ray.intersectPlane(dragPlane,p);if(okp)p.y-=gy;
    drag={it,target:okp?p:it.mesh.position.clone(),s:[e.clientX,e.clientY],gy};
  }
  addEventListener('pointermove',onMove);addEventListener('pointerup',onUp);addEventListener('pointercancel',onUp);
}
function screenAngle(e,it){
  const p=new V3();it.rotCenter.getWorldPosition(p);p.project(camera);
  const r=renderer.domElement.getBoundingClientRect();
  const cx=(p.x+1)/2*r.width+r.left,cy=(1-p.y)/2*r.height+r.top;
  return Math.atan2(-(e.clientY-cy),e.clientX-cx);
}
function onMove(e){
  if(!drag)return;
  if(drag.rot){const a=screenAngle(e,drag.it);let d=a-drag.last;if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;drag.last=a;drag.it.rotate(d);return;}
  drag.s=[e.clientX,e.clientY];
  setNDC(e);ray.setFromCamera(ndc,camera);
  const p=new V3();if(ray.ray.intersectPlane(dragPlane,p)){p.y-=drag.gy||0;drag.target.copy(p);}
}
/* 화면 기준 판정: 손가락(마우스) 위치에서 화면상 가장 가까운 기구로 들어가요.
   기구는 바닥~입구까지 세로 선분으로 보고 거리를 재요. 원래 자리가 더 가까우면 제자리로. */
const _sp=new V3();
function toScreen(x,y,z){_sp.set(x,y,z).project(camera);return [(_sp.x+1)/2*innerWidth,(1-_sp.y)/2*innerHeight];}
function segDist(px,py,a,b){
  const vx=b[0]-a[0],vy=b[1]-a[1];const L=vx*vx+vy*vy;
  let t=L?((px-a[0])*vx+(py-a[1])*vy)/L:0;t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(a[0]+vx*t),py-(a[1]+vy*t));
}
function bestZone(it,s){
  if(!s)return null;
  const hp=it.homeAnchor||(it.kind==='chip'?D.mix.mesh.position:it.home);
  let best=null,bd=1e9;
  if(hp){const h=toScreen(hp.x,hp.y,hp.z);bd=Math.hypot(s[0]-h[0],s[1]-h[1]);}
  for(const z of zones){
    if(z.station!==tab||!z.accepts(it))continue;
    const d=z.obj?rectDist(s,z):segDist(s[0],s[1],toScreen(z.p.x,0,z.p.z),toScreen(z.p.x,z.p.y,z.p.z));
    if(d<bd){bd=d;best=z;}
  }
  return best;
}
/* 기구가 화면에 차지하는 사각형까지의 거리(안에 있으면 0) */
function rectDist(s,z){
  if(!z.corners||z.dynamic){const b=new THREE.Box3().setFromObject(z.obj);z.corners=[];
    for(const x of [b.min.x,b.max.x])for(const y of [b.min.y,b.max.y])for(const zz of [b.min.z,b.max.z])z.corners.push(new V3(x,y,zz));}
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const c of z.corners){const q=toScreen(c.x,c.y,c.z);x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1]);}
  const dx=Math.max(x0-s[0],0,s[0]-x1),dy=Math.max(y0-s[1],0,s[1]-y1);
  return Math.hypot(dx,dy);
}
function onUp(){
  removeEventListener('pointermove',onMove);removeEventListener('pointerup',onUp);removeEventListener('pointercancel',onUp);
  if(!drag)return;const d=drag;drag=null;
  for(const z of zones)z.ring.material.opacity=0;
  if(d.rot){if(d.it.rotateEnd)d.it.rotateEnd();return;}
  const it=d.it;const z=bestZone(it,d.s);
  if(z)z.accept(it);else goHome(it);
}
function goHome(it){
  it.busy=true;it.state='moving';
  if(it.goHome){it.goHome(it);return;}
  moveTo(it.mesh,it.home,.45,3,()=>{it.busy=false;it.state='home';if(it.onHome)it.onHome(it);});
}
stage.addEventListener('pointerdown',onDown,true);
function updateDrag(){
  if(!drag||drag.rot)return;
  const m=drag.it.mesh;m.position.lerp(drag.target,.4);
  const best=bestZone(drag.it,drag.s);
  for(const z of zones){
    if(z.station!==tab||!z.accepts(drag.it)){z.ring.material.opacity=0;continue;}
    if(z.dynamic){const o=z.obj.position;z.ring.position.set(o.x,o.y+z.ringY,o.z);}
    z.ring.material.opacity=z===best?.95:.18;
  }
}

/* ---------- 액체 속 물체(뜨고 가라앉음) ---------- */
const G=300; // 보기 좋게 줄인 중력 가속도(cm/s²)
const tanks=[];
function makeTank(beaker,rho,k,station){const t={b:beaker,rho,k,station,list:[]};tanks.push(t);return t;}
function tankAdd(tank,it,x,z){
  it.tank=tank;it.vy=0;it.age=0;it.reported=false;it.slot={x,z};it.state='tank';
  if(!tank.list.includes(it))tank.list.push(it);
}
function tankRemove(it){if(!it.tank)return;const l=it.tank.list;const i=l.indexOf(it);if(i>=0)l.splice(i,1);it.tank=null;}
function fsubOf(it,depth){
  const H=2*it.hh;const d=Math.min(Math.max(depth,0),H);
  if(it.shape==='ell'){const b=it.hh;return d*d*(3*b-d)/(4*b*b*b);}
  return d/H;
}
function stepTanks(dt){
  const n=Math.max(1,Math.ceil(dt/(1/240)));const h=dt/n;
  for(const t of tanks){
    for(const it of t.list){
      if(it.state!=='tank')continue;
      const m=it.mesh;
      for(let s=0;s<n;s++){
        const top=t.b.surfaceY(),floor=t.b.floorY();
        const f=fsubOf(it,top-(m.position.y-it.hh));
        const k=f<=0?.6:(f<.995?Math.max(t.k,28):t.k);
        const a=G*(-1+(t.rho/it.rho)*f)-k*it.vy;
        it.vy+=a*h;m.position.y+=it.vy*h;
        if(m.position.y-it.hh<floor+.02){m.position.y=floor+.02+it.hh;if(it.vy<0)it.vy=0;}
        m.position.x+=(it.slot.x-m.position.x)*Math.min(1,h*10);
        m.position.z+=(it.slot.z-m.position.z)*Math.min(1,h*10);
      }
      it.age+=dt;
      if(it.wob){const w=it.wob*Math.exp(-it.age*1.4)*Math.sin(it.age*7);m.rotation.x=it.rx0+w;m.rotation.z=it.rz0+w*.7;}
      if(!it.reported&&it.age>.6){
        const top=t.b.surfaceY(),floor=t.b.floorY();
        const onFloor=m.position.y-it.hh<floor+.06;
        const f=fsubOf(it,top-(m.position.y-it.hh));
        if((onFloor&&Math.abs(it.vy)<.5)||(f>0&&f<1&&Math.abs(it.vy)<.4)){it.reported=true;if(it.onSettle)it.onSettle(it,t);}
      }
    }
  }
}

function chipPick(c){

}

const VIEWS={
  A:{t:[-1,6.5,5],d:[0,.5,.87],w:25,h:15},
  B:{t:[0,5,3],d:[0,.55,.84],w:30,h:12},
  C:{t:[1,8,1],d:[0,.48,.88],w:19,h:13.5},

  E:{t:[5.5,21,1],d:[0,.24,.97],w:21,h:26}
};
let camAnim=null;
function viewFor(id){
  const v=VIEWS[id];const sx=SX[id];
  const target=new V3(sx+v.t[0],v.t[1],v.t[2]);
  const dir=new V3(...v.d);if(innerWidth<innerHeight)dir.y+=.35;dir.normalize();
  const W=innerWidth,H=innerHeight;const pw=panelUsed();
  const eff=(W-pw)/H;const tv=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  let d=Math.max(v.h/tv,v.w/(tv*eff));
  if(isMobile()&&!$('#panel').classList.contains('closed'))d*=1.05;
  return {target,pos:target.clone().addScaledVector(dir,d)};
}
function goView(id,instant){
  const v=viewFor(id);
  if(instant){camera.position.copy(v.pos);controls.target.copy(v.target);controls.update();return;}
  const p0=camera.position.clone(),t0=controls.target.clone();
  controls.enabled=false;
  camAnim=tween(1.25,k=>{
    camera.position.lerpVectors(p0,v.pos,k);
    const lift=Math.sin(k*Math.PI)*6;camera.position.y+=lift;
    controls.target.lerpVectors(t0,v.target,k);camera.lookAt(controls.target);
  },()=>{camAnim=null;controls.enabled=true;controls.update();});
}
function panelUsed(){return (!isMobile()&&!$('#panel').classList.contains('closed'))?parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--pw'))+28:0;}
function resize(){
  const W=innerWidth,H=innerHeight;renderer.setSize(W,H);camera.aspect=W/H;
  const off=panelUsed()/2;
  if(off>0)camera.setViewOffset(W,H,off,24,W,H);else camera.setViewOffset(W,H,0,isMobile()?-10:24,W,H);
  camera.updateProjectionMatrix();
}

function drawLineB(){

  g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=3;g.beginPath();g.moveTo(L,y);g.lineTo(R+30,y);g.stroke();
  g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.moveTo(R+40,y);g.lineTo(R+26,y-8);g.lineTo(R+26,y+8);g.fill();
  g.font='19px "IBM Plex Sans KR",sans-serif';g.textAlign='center';g.fillStyle='#9a9083';
  for(let r=.7;r<=1.401;r+=.1){g.fillRect(X(r)-1,y-6,2,12);g.fillText(r.toFixed(1),X(r),y+32);}
  g.fillText('밀도(g/mL)',(L+R)/2,cv.height-8);
  LIQ_B.forEach(l=>{g.fillStyle='#7cc6f0';g.fillRect(X(l.rho)-3,y-42,6,42);g.font='bold 20px "IBM Plex Sans KR",sans-serif';g.fillText(l.name,X(l.rho),y-52);});
  OBJ_B.forEach(o=>{
    const seen=LIQ_B.some(l=>B.seen[o.id+'|'+l.id]);if(!seen)return;
    const x=o.rho>hi?R+12:X(o.rho);
    g.fillStyle='#f0b65e';g.beginPath();g.arc(x,y,9,0,7);g.fill();
    g.font='bold 19px "IBM Plex Sans KR",sans-serif';g.fillText(o.rho>hi?'구리 8.93 →':o.name.replace(' 조각',''),Math.min(x,cv.width-70),y+62);
  });
}
function refreshC(){
  const r=rhoSalt();const d=Math.min(C.salt,C.sat),und=Math.max(0,C.salt-C.sat);
  const el=$('#readC');
  if(el)el.innerHTML=`<span>넣은 소금</span><span>${C.salt} g${und?` (녹지 않음 ${und} g)`:''}</span><span>소금물의 밀도</span><span>${r.toFixed(3)} g/mL</span><span>오래된 달걀</span><span>${RHO_EGG.old.toFixed(2)} g/mL</span><span>신선한 달걀</span><span>${RHO_EGG.fresh.toFixed(2)} g/mL</span>`;
  const oldF=r>RHO_EGG.old,frF=r>RHO_EGG.fresh;
  if(oldF&&!frF&&!C.done1){C.done1=true;say('오래된 달걀만 떠올랐어요. 소금물의 밀도가 1.03보다 커졌기 때문이에요.');}
  if(frF&&!C.done2){C.done2=true;C.done1=true;setTimeout(()=>{celebrate();say('두 달걀이 모두 떴어요!');},1500);}
  mark('mC1',C.done1);mark('mC2',C.done2);
  const ex=$('#explC');
  if(ex)ex.innerHTML=C.salt===0?'두 달걀 모두 물(1.00)보다 밀도가 커서 가라앉아 있어요.':
    `소금물은 <b>혼합물</b>이라서 섞인 소금의 양에 따라 밀도가 달라져요. 소금을 녹일수록 밀도가 커져요.${oldF&&!frF?'<br>지금은 오래된 달걀 &lt; 소금물 &lt; 신선한 달걀 순서예요. 이렇게 하면 두 달걀을 구분할 수 있어요.':''}`;
  drawMeterC(r);
}
function drawMeterC(r){
  const C2=chartCtx('meterC');if(!C2)return;const {cv,g}=C2;
  const L=40,R=cv.width-40,y=100;const lo=1.0,hi=1.2;const X=v=>L+(R-L)*(v-lo)/(hi-lo);
  const gr=g.createLinearGradient(L,0,R,0);gr.addColorStop(0,'rgba(124,198,240,.25)');gr.addColorStop(1,'rgba(124,198,240,.7)');
  g.fillStyle='rgba(255,255,255,.08)';g.fillRect(L,y-14,R-L,28);g.fillStyle=gr;g.fillRect(L,y-14,X(r)-L,28);
  g.font='19px "IBM Plex Sans KR",sans-serif';g.textAlign='center';g.fillStyle='#9a9083';
  for(let v=1;v<=1.2001;v+=.05)g.fillText(v.toFixed(2),X(v),y+44);
  [[RHO_EGG.old,'오래된 달걀'],[RHO_EGG.fresh,'신선한 달걀']].forEach(([v,n])=>{g.fillStyle='#f0b65e';g.fillRect(X(v)-2,y-30,4,60);g.font='bold 19px "IBM Plex Sans KR",sans-serif';g.fillText(n,X(v),y-40);});
  g.fillStyle='#f4efe7';g.beginPath();g.moveTo(X(r),y+16);g.lineTo(X(r)-9,y+30);g.lineTo(X(r)+9,y+30);g.fill();
  g.font='18px "IBM Plex Sans KR",sans-serif';g.fillStyle='#c9c0b3';g.fillText('소금물의 밀도',(L+R)/2,cv.height-6);
}
function refreshD(){
  const el=$('#readD');if(!el)return;
  const n={ldpe:D.sort.ldpe.list.length,ps:D.sort.ps.list.length,pet:D.sort.pet.list.length};
  el.innerHTML=`<span>LDPE 접시</span><span>${n.ldpe} / 3</span><span>PS 접시</span><span>${n.ps} / 3</span><span>PET 접시</span><span>${n.pet} / 3</span>`;
  const tot=n.ldpe+n.ps+n.pet;
  mark('mD1',D.chips.some(c=>c.seen.w));mark('mD2',tot>0);mark('mD3',tot===9);$('#cntD').textContent=`(${tot}/9)`;
  const c=$('#conclD');
  if(tot>=3){c.hidden=false;c.innerHTML='물(1.00)에서 뜨는 것은 <b>LDPE</b>, 물에서 가라앉고 글리세롤(1.26)에서 뜨는 것은 <b>PS</b>, 글리세롤에서도 가라앉는 것은 <b>PET</b>예요.';}else c.hidden=true;
  if(tot===9&&!D.done){D.done=true;celebrate();say('9개 조각을 모두 분류했어요!');}
}
function refreshEReadout(){
  const el=$('#readE');if(!el)return;

  el.innerHTML=`<span>깔때기</span><span>물 ${f(E.water)} · 식용유 ${f(E.oil)}</span>`+
    E.rb.map(r=>`<span>${r.name} 비커</span><span>물 ${f(r.w)} · 식용유 ${f(r.o)}</span>`).join('')+

}

/* ---------- 확인 문제·QR ---------- */
const QUIZ=[
  {q:'철 A(부피 4 mL)와 철 C(부피 12 mL)의 밀도를 비교하면?',o:['철 A가 크다','철 C가 크다','같다'],a:2,e:'같은 물질은 양에 관계없이 밀도가 일정해요. 둘 다 7.87 g/mL예요.'},
  {q:'PP 플라스틱(0.90 g/mL) 조각을 식용유(0.93 g/mL)에 넣으면?',o:['뜬다','가라앉는다'],a:0,e:'물체의 밀도가 액체보다 작으면 떠요.'},
  {q:'물에 가라앉았던 달걀이 소금을 더 녹이자 떠올랐어요. 그 까닭은?',o:['달걀의 밀도가 작아져서','소금물의 밀도가 커져서','달걀의 질량이 줄어서'],a:1,e:'소금물은 혼합물이라 녹인 소금의 양에 따라 밀도가 달라져요.'},
  {q:'LDPE(0.91)·PS(1.06)·PET(1.35) 혼합물을 물(1.00)에 넣었을 때 뜨는 것은?',o:['LDPE','PS','PET'],a:0,e:'물보다 밀도가 작은 LDPE만 떠요. 가라앉은 PS와 PET는 글리세롤(1.26)로 나눌 수 있어요.'},
  {q:'물과 식용유를 분별 깔때기에 넣었을 때 아래층을 이루는 것은?',o:['물','식용유'],a:0,e:'밀도가 큰 물이 아래층이에요. 꼭지를 열어 아래층부터 따라 내요.'}
];
function buildQuiz(){
  const box=$('#quiz');
  box.innerHTML=QUIZ.map((q,i)=>`<div class="q"><p>${i+1}. ${q.q}</p><div class="opts">${q.o.map((o,j)=>`<button class="opt" type="button" data-q="${i}" data-j="${j}">${o}</button>`).join('')}</div><div class="exp" id="exp${i}" hidden></div></div>`).join('');
  box.onclick=e=>{const b=e.target.closest('.opt');if(!b)return;const i=+b.dataset.q,j=+b.dataset.j;const q=QUIZ[i];
    b.parentElement.querySelectorAll('.opt').forEach(x=>x.classList.remove('right','wrong'));
    b.classList.add(j===q.a?'right':'wrong');const ex=$('#exp'+i);ex.hidden=false;ex.innerHTML=(j===q.a?'<b style="color:var(--ok)">정답!</b> ':'<b style="color:var(--warn)">다시 생각해 보세요.</b> ')+(j===q.a?q.e:'');};
}
