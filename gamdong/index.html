<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0b17">
<title>감동 투표</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
  :root { --sky: #6ec6ff; --sky-2: #8fd5ff; --grass: #5bd34a; --grass-2: #2f9a2a; --dirt: #c7783a; --dirt-2: #8a4a1c;
    --block: #ffcf3a; --block-2: #c97d00; --heart: #ff4f8b; --ink: #1b1f3b; --gold: #ffe14d; --px: "Galmuri11", "Galmuri9", monospace; }
  body { min-height: 100dvh; overflow-x: hidden; background: var(--sky); color: #fff; font-family: var(--px); -webkit-font-smoothing: none; }
  .spotlight { position: fixed; inset: 0; z-index: 0; background: linear-gradient(var(--sky-2) 0 16%, var(--sky) 16%); }
  .cloud { position: absolute; width: 120px; height: 40px; animation: drift linear infinite; }
  .cloud i { position: absolute; background: #fff; box-shadow: 0 4px 0 #cfeaff; }
  .cloud i:nth-child(1) { left: 16px; top: 0; width: 44px; height: 16px; }
  .cloud i:nth-child(2) { left: 0; top: 13px; width: 120px; height: 18px; }
  @keyframes drift { from { transform: translateX(110vw); } to { transform: translateX(-140px); } }
  .ground { position: fixed; left: 0; right: 0; bottom: 0; height: 64px; z-index: 0;
    background: linear-gradient(var(--grass) 0 10px, var(--grass-2) 10px 15px, transparent 15px),
      linear-gradient(var(--dirt-2) 3px, transparent 3px) 0 15px / 100% 24px,
      linear-gradient(90deg, var(--dirt-2) 3px, transparent 3px) 0 15px / 48px 24px, var(--dirt); }
  .sh { text-shadow: 3px 3px 0 var(--ink); }
  .wrap { position: relative; z-index: 1; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; text-align: center;
    padding: max(18px, env(safe-area-inset-top)) 18px calc(80px + env(safe-area-inset-bottom)); }
  header { width: 100%; }
  .event { font-weight: 700; font-size: 16px; text-shadow: 2px 2px 0 var(--ink); }
  .sub { font-size: 11px; color: var(--gold); margin-top: 6px; letter-spacing: .2em; text-shadow: 2px 2px 0 var(--ink); }
  main { flex: 1; width: 100%; max-width: 420px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px; }
  .now { font-size: 12px; color: var(--gold); letter-spacing: .15em; text-shadow: 2px 2px 0 var(--ink); }
  .name { font-weight: 700; font-size: clamp(28px, 8.5vw, 38px); line-height: 1.25; text-shadow: 4px 4px 0 var(--ink); }
  .song { font-size: 15px; margin-top: 8px; text-shadow: 2px 2px 0 var(--ink); }
  .song:empty { display: none; }
  .msg { font-size: 15px; line-height: 1.7; background: var(--ink); padding: 12px 16px; margin: 0; }
  /* 하트 블록 버튼 */
  .heart-btn { position: relative; width: min(56vw, 210px); aspect-ratio: 1; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent;
    background: var(--block); display: grid; place-items: center; font-family: var(--px);
    box-shadow: inset -12px -12px 0 var(--block-2), inset 12px 12px 0 #fff2a8, 0 0 0 5px var(--ink), 8px 8px 0 5px var(--ink);
    animation: bump 1.1s steps(2) infinite; }
  .heart-btn::before { content: ""; position: absolute; width: 10px; height: 10px; background: var(--block-2); top: 18px; left: 18px;
    box-shadow: calc(min(56vw, 210px) - 46px) 0 0 var(--block-2), 0 calc(min(56vw, 210px) - 46px) 0 var(--block-2), calc(min(56vw, 210px) - 46px) calc(min(56vw, 210px) - 46px) 0 var(--block-2); }
  .heart-btn svg { width: 46%; margin-top: -10%; }
  .heart-btn b { position: absolute; bottom: 18%; font-size: clamp(15px, 4.6vw, 19px); color: var(--ink); }
  .heart-btn:active { animation: none; transform: translateY(-14px); }
  @keyframes bump { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .hint { font-size: 13px; line-height: 1.7; margin: 0; text-shadow: 2px 2px 0 var(--ink); }
  .done-ring { width: min(46vw, 170px); aspect-ratio: 1; display: grid; place-items: center; background: #fff;
    box-shadow: 0 0 0 5px var(--ink), 8px 8px 0 5px var(--ink); animation: pop .4s steps(4); }
  .done-ring svg { width: 60%; }
  @keyframes pop { from { transform: scale(.5); } to { transform: scale(1); } }
  .done-title { font-weight: 700; font-size: 24px; color: var(--gold); text-shadow: 3px 3px 0 var(--ink); }
  .waiting-dots span { display: inline-block; width: 10px; height: 10px; margin: 0 5px; background: #fff; box-shadow: 2px 2px 0 var(--ink); animation: blink 1.2s steps(1) infinite; }
  .waiting-dots span:nth-child(2) { animation-delay: .4s; }
  .waiting-dots span:nth-child(3) { animation-delay: .8s; }
  @keyframes blink { 50% { opacity: .15; } }
  .err { color: #fff; background: #d9304f; font-size: 13px; min-height: 0; margin: 0; padding: 0 8px; }
  .err:empty { display: none; }
  footer { position: relative; z-index: 2; font-size: 11px; color: #fff; text-shadow: 1px 1px 0 var(--ink); }
  .demo-badge { left: auto; right: 12px; bottom: auto; top: max(12px, env(safe-area-inset-top)); font-family: var(--px); background: var(--ink); color: var(--gold); border-radius: 0; border: 0; }
  .spark { position: fixed; pointer-events: none; z-index: 5; font-family: var(--px); font-weight: 700; font-size: 22px; color: var(--gold); text-shadow: 3px 3px 0 var(--ink); animation: up .9s steps(6) forwards; }
  .bit { position: fixed; pointer-events: none; z-index: 5; width: 10px; height: 10px; animation: fly .8s steps(6) forwards; }
  @keyframes up { to { transform: translateY(-120px); opacity: 0; } }
  @keyframes fly { to { transform: translate(var(--dx), var(--dy)); opacity: 0; } }
</style>
</head>
<body>
<div class="spotlight">
  <div class="cloud" style="top:9vh;animation-duration:38s;animation-delay:-8s"><i></i><i></i></div>
  <div class="cloud" style="top:26vh;animation-duration:52s;animation-delay:-30s"><i></i><i></i></div>
</div>
<div class="ground"></div>
<div class="wrap">
  <header>
    <div class="event" id="eventTitle">감동 투표</div>
    <div class="sub">SONG BATTLE · 관객 투표</div>
  </header>

  <main id="view">
    <div class="waiting-dots"><span></span><span></span><span></span></div>
    <p class="msg">연결 중입니다…</p>
  </main>

  <footer>한 기기에서 무대마다 한 번씩 투표할 수 있어요</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-database-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script>
(async function () {
  const view = document.getElementById("view");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // 픽셀 그림 (문자 격자 → SVG)
  const PIX = (rows, color) => {
    let r = "";
    rows.forEach((row, y) => [...row].forEach((ch, x) => { if (ch !== ".") r += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${color[ch]}"/>`; }));
    return `<svg viewBox="0 0 ${rows[0].length} ${rows.length}" shape-rendering="crispEdges">${r}</svg>`;
  };
  const HEART = PIX([".ww.hh.", "whhhhhd", "hhhhhhd", ".hhhhd.", "..hhd..", "...d..."], { w: "#ffb3cd", h: "#ff4f8b", d: "#b8205a" });
  const CHECK = PIX(["......gg", ".....ggd", "g...ggd.", "gg.ggd..", ".gggd...", "..gd...."], { g: "#5bd34a", d: "#2f9a2a" });

  if (GD.isDemo) document.body.insertAdjacentHTML("beforeend", '<div class="demo-badge">데모 모드</div>');

  try { await GD.init({ anonymous: true }); }
  catch (e) {
    view.innerHTML = '<p class="msg">서버에 연결하지 못했어요.<br>잠시 후 새로고침해 주세요.</p>';
    return;
  }
  GD.join();

  let state = {}, contestants = {}, myVote = null, unsubVote = null, voteFor = null, busy = false, errMsg = "";

  GD.on("config/title", (t) => {
    document.getElementById("eventTitle").textContent = t || "감동 투표";
    document.title = (t || "감동 투표") + " · 관객 투표";
  });
  GD.on("contestants", (c) => { contestants = c || {}; render(); });
  GD.on("state", (s) => {
    state = s || {};
    if (state.currentId !== voteFor) {
      if (unsubVote) unsubVote();
      myVote = null; voteFor = state.currentId || null; errMsg = "";
      if (voteFor) unsubVote = GD.on(`votes/${voteFor}/${GD.uid}`, (v) => { myVote = v; render(); });
    }
    render();
  });

  function head(c) {
    return `<div><div class="now">${state.phase === "open" ? "지금 무대" : "다음 무대"}</div></div>
            <div><div class="name">${esc(c.name)}</div><div class="song">${esc(c.song)}</div></div>`;
  }

  function render() {
    const c = contestants[state.currentId];
    if (!c || !state.phase || state.phase === "ranking" || state.phase === "final") {
      view.innerHTML = `<div class="waiting-dots"><span></span><span></span><span></span></div>
        <p class="msg">${state.phase === "ranking" || state.phase === "final" ? "최종 결과가 발표되고 있어요!<br>무대 화면을 봐 주세요." : "곧 경연이 시작됩니다.<br>이 화면을 켜 두고 기다려 주세요."}</p>`;
      return;
    }
    if (myVote) {
      view.innerHTML = `${head(c)}
        <div class="done-ring">${CHECK}</div>
        <div class="done-title">감동 전달 완료!</div>
        <p class="hint">${state.phase === "open" ? "투표가 끝날 때까지 기다려 주세요." : "결과는 모든 무대가 끝난 뒤 공개됩니다."}</p>`;
      return;
    }
    if (state.phase === "ready") {
      view.innerHTML = `${head(c)}
        <div class="waiting-dots"><span></span><span></span><span></span></div>
        <p class="msg">무대가 시작되면 투표 버튼이 열려요.</p>`;
      return;
    }
    if (state.phase === "open") {
      view.innerHTML = `${head(c)}
        <button class="heart-btn" id="voteBtn" aria-label="감동 받았어요">${HEART}<b>감동!</b></button>
        <p class="hint">노래에 감동했다면 하트 블록을 눌러 주세요.<br>한 번 누르면 취소할 수 없어요.</p>
        <p class="err">${esc(errMsg)}</p>`;
      document.getElementById("voteBtn").onclick = doVote;
      return;
    }
    view.innerHTML = `${head(c)}
      <p class="msg">이번 무대의 투표가 마감되었어요.<br>결과는 모든 무대가 끝난 뒤 공개됩니다.</p>`;
  }

  async function doVote(ev) {
    if (busy) return;
    busy = true;
    const r = ev.currentTarget.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2);
    if (navigator.vibrate) navigator.vibrate(60);
    try {
      await GD.vote(state.currentId);
      myVote = myVote || Date.now();
      errMsg = "";
    } catch (e) {
      errMsg = e.message === "already" ? "" : "투표가 마감되었거나 연결이 불안정해요.";
      if (e.message === "already") myVote = myVote || 1;
    }
    busy = false;
    render();
  }

  function burst(x, y) {
    const plus = document.createElement("div");           // "+1" 픽셀 글자
    plus.className = "spark"; plus.textContent = "+1 감동!";
    plus.style.left = x - 50 + "px"; plus.style.top = y - 140 + "px";
    document.body.appendChild(plus); setTimeout(() => plus.remove(), 1000);
    const colors = ["#ffcf3a", "#ff4f8b", "#ffffff", "#5bd34a"];
    for (let i = 0; i < 12; i++) {                         // 네모 조각
      const s = document.createElement("div");
      s.className = "bit";
      const ang = (Math.PI * 2 * i) / 12, d = 80 + Math.random() * 60;
      s.style.left = x - 5 + "px"; s.style.top = y - 5 + "px"; s.style.background = colors[i % 4];
      s.style.setProperty("--dx", Math.cos(ang) * d + "px");
      s.style.setProperty("--dy", Math.sin(ang) * d + "px");
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 900);
    }
  }
})();
</script>
</body>
</html>
