<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0b17">
<title>감동 투표</title>
<link rel="stylesheet" href="css/common.css">
<style>
  body { min-height: 100dvh; overflow-x: hidden; }
  .wrap {
    position: relative; z-index: 1; min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center;
    padding: max(20px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    text-align: center;
  }
  header { width: 100%; }
  .event { font-family: var(--serif); font-weight: 700; font-size: 18px; color: var(--gold); letter-spacing: .02em; }
  .sub { font-size: 12px; color: var(--muted); margin-top: 4px; letter-spacing: .2em; }

  main { flex: 1; width: 100%; max-width: 420px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 22px; }

  .now { font-size: 13px; color: var(--muted); letter-spacing: .15em; }
  .name { font-family: var(--serif); font-weight: 900; font-size: clamp(30px, 9vw, 40px); line-height: 1.2; }
  .song { font-size: 16px; color: var(--ink-2); margin-top: 6px; }
  .song:empty { display: none; }
  .msg { font-size: 16px; color: var(--ink-2); line-height: 1.6; }

  /* 감동 버튼 */
  .heart-btn {
    position: relative; width: min(68vw, 260px); aspect-ratio: 1; border-radius: 50%;
    border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent;
    background: radial-gradient(circle at 50% 38%, #ffe7b5, var(--gold) 45%, #b9853a 100%);
    box-shadow: 0 0 0 10px rgba(243,197,111,.10), 0 0 60px rgba(243,197,111,.45), inset 0 -10px 30px rgba(120,70,10,.35);
    display: grid; place-items: center; color: #3b2508;
    transition: transform .12s ease;
    animation: breathe 2.4s ease-in-out infinite;
  }
  .heart-btn:active { transform: scale(.94); }
  .heart-btn svg { width: 34%; height: auto; }
  .heart-btn b { position: absolute; bottom: 21%; font-size: clamp(17px, 5vw, 21px); font-weight: 800; letter-spacing: -.01em; }
  @keyframes breathe {
    0%,100% { box-shadow: 0 0 0 10px rgba(243,197,111,.10), 0 0 50px rgba(243,197,111,.35), inset 0 -10px 30px rgba(120,70,10,.35); }
    50%     { box-shadow: 0 0 0 18px rgba(243,197,111,.06), 0 0 90px rgba(243,197,111,.6),  inset 0 -10px 30px rgba(120,70,10,.35); }
  }
  .hint { font-size: 14px; color: var(--muted); line-height: 1.6; }

  .done-ring {
    width: min(56vw, 210px); aspect-ratio: 1; border-radius: 50%;
    display: grid; place-items: center;
    background: radial-gradient(circle, rgba(243,197,111,.18), transparent 70%);
    border: 2px solid rgba(243,197,111,.5);
    animation: pop .5s cubic-bezier(.2,1.6,.4,1);
  }
  .done-ring svg { width: 46%; color: var(--gold-hi); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .done-title { font-family: var(--serif); font-size: 24px; font-weight: 700; color: var(--gold-hi); }

  .waiting-dots span { display: inline-block; width: 8px; height: 8px; margin: 0 4px; border-radius: 50%; background: var(--gold); opacity: .3; animation: blink 1.4s infinite; }
  .waiting-dots span:nth-child(2) { animation-delay: .2s; }
  .waiting-dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 50% { opacity: 1; } }

  .err { color: var(--rose); font-size: 14px; min-height: 1.2em; }
  .demo-badge { left: auto; right: 12px; bottom: auto; top: max(12px, env(safe-area-inset-top)); }
  footer { font-size: 11px; color: var(--muted); opacity: .7; }

  /* 반짝이 */
  .spark { position: fixed; pointer-events: none; width: 10px; height: 10px; border-radius: 50%; background: var(--gold-hi); z-index: 5; animation: fly 1s ease-out forwards; }
  @keyframes fly { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
</style>
</head>
<body>
<div class="spotlight"></div>
<div class="wrap">
  <header>
    <div class="event" id="eventTitle">감동 투표</div>
    <div class="sub">관객 투표</div>
  </header>

  <main id="view">
    <div class="waiting-dots"><span></span><span></span><span></span></div>
    <p class="msg">연결 중입니다…</p>
  </main>

  <footer>한 기기에서 무대마다 한 번씩 투표할 수 있어요</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-database-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script>
(async function () {
  const view = document.getElementById("view");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const HEART = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.1 4.4 2.4h1.6c.8-1.3 2.3-2.4 4.4-2.4 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>';
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  if (GD.isDemo) document.body.insertAdjacentHTML("beforeend", '<div class="demo-badge">데모 모드</div>');

  try { await GD.init({ anonymous: true }); }
  catch (e) {
    view.innerHTML = '<p class="msg">서버에 연결하지 못했어요.<br>잠시 후 새로고침해 주세요.</p>';
    return;
  }
  GD.join();

  let state = {}, contestants = {}, myVote = null, unsubVote = null, voteFor = null, busy = false, errMsg = "";

  GD.on("config/title", (t) => {
    document.getElementById("eventTitle").textContent = t || "감동 투표";
    document.title = (t || "감동 투표") + " · 관객 투표";
  });
  GD.on("contestants", (c) => { contestants = c || {}; render(); });
  GD.on("state", (s) => {
    state = s || {};
    if (state.currentId !== voteFor) {
      if (unsubVote) unsubVote();
      myVote = null; voteFor = state.currentId || null; errMsg = "";
      if (voteFor) unsubVote = GD.on(`votes/${voteFor}/${GD.uid}`, (v) => { myVote = v; render(); });
    }
    render();
  });

  function head(c) {
    return `<div><div class="now">${state.phase === "open" ? "지금 무대" : "다음 무대"}</div></div>
            <div><div class="name">${esc(c.name)}</div><div class="song">${esc(c.song)}</div></div>`;
  }

  function render() {
    const c = contestants[state.currentId];
    if (!c || !state.phase || state.phase === "ranking" || state.phase === "final") {
      view.innerHTML = `<div class="waiting-dots"><span></span><span></span><span></span></div>
        <p class="msg">${state.phase === "ranking" || state.phase === "final" ? "최종 결과가 발표되고 있어요!<br>무대 화면을 봐 주세요." : "곧 경연이 시작됩니다.<br>이 화면을 켜 두고 기다려 주세요."}</p>`;
      return;
    }
    if (myVote) {
      view.innerHTML = `${head(c)}
        <div class="done-ring">${CHECK}</div>
        <div class="done-title">감동을 전했어요</div>
        <p class="hint">${state.phase === "open" ? "투표가 끝날 때까지 기다려 주세요." : "결과는 모든 무대가 끝난 뒤 공개됩니다."}</p>`;
      return;
    }
    if (state.phase === "ready") {
      view.innerHTML = `${head(c)}
        <div class="waiting-dots"><span></span><span></span><span></span></div>
        <p class="msg">무대가 시작되면 투표 버튼이 열려요.</p>`;
      return;
    }
    if (state.phase === "open") {
      view.innerHTML = `${head(c)}
        <button class="heart-btn" id="voteBtn" aria-label="감동 받았어요">${HEART}<b>감동 받았어요</b></button>
        <p class="hint">노래에 감동했다면 눌러 주세요.<br>한 번 누르면 취소할 수 없어요.</p>
        <p class="err">${esc(errMsg)}</p>`;
      document.getElementById("voteBtn").onclick = doVote;
      return;
    }
    view.innerHTML = `${head(c)}
      <p class="msg">이번 무대의 투표가 마감되었어요.<br>결과는 모든 무대가 끝난 뒤 공개됩니다.</p>`;
  }

  async function doVote(ev) {
    if (busy) return;
    busy = true;
    const r = ev.currentTarget.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2);
    if (navigator.vibrate) navigator.vibrate(60);
    try {
      await GD.vote(state.currentId);
      myVote = myVote || Date.now();
      errMsg = "";
    } catch (e) {
      errMsg = e.message === "already" ? "" : "투표가 마감되었거나 연결이 불안정해요.";
      if (e.message === "already") myVote = myVote || 1;
    }
    busy = false;
    render();
  }

  function burst(x, y) {
    for (let i = 0; i < 18; i++) {
      const s = document.createElement("div");
      s.className = "spark";
      const a = (Math.PI * 2 * i) / 18, d = 90 + Math.random() * 70;
      s.style.left = x - 5 + "px"; s.style.top = y - 5 + "px";
      s.style.setProperty("--dx", Math.cos(a) * d + "px");
      s.style.setProperty("--dy", Math.sin(a) * d + "px");
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 1000);
    }
  }
})();
</script>
</body>
</html>
