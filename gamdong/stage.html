<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>무대 화면</title>
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<style>
  :root {
    --sky: #6ec6ff; --sky-2: #8fd5ff; --cloud: #ffffff; --cloud-sh: #cfeaff;
    --grass: #5bd34a; --grass-2: #2f9a2a; --dirt: #c7783a; --dirt-2: #8a4a1c;
    --block: #ffcf3a; --block-2: #c97d00; --heart: #ff4f8b; --heart-2: #b8205a;
    --ink: #1b1f3b; --white: #ffffff; --gold: #ffe14d;
    --px: "Galmuri11", "Galmuri9", monospace;
  }
  html, body { overflow: hidden; }
  body { background: var(--sky); color: var(--white); font-family: var(--px); cursor: default; -webkit-font-smoothing: none; }
  .spotlight { display: none; }
  /* 하늘 줄무늬 + 구름 + 땅 */
  .sky { position: fixed; inset: 0; z-index: 0; background:
      linear-gradient(var(--sky-2) 0 18%, var(--sky) 18% 100%); }
  .cloud { position: absolute; width: 22vh; height: 7vh; animation: drift linear infinite; }
  .cloud i { position: absolute; background: var(--cloud); box-shadow: 0 .8vh 0 var(--cloud-sh); }
  .cloud i:nth-child(1) { left: 3vh; top: 0; width: 8vh; height: 3vh; }
  .cloud i:nth-child(2) { left: 0; top: 2.4vh; width: 22vh; height: 3.4vh; }
  .cloud i:nth-child(3) { left: 11vh; top: -1.6vh; width: 6vh; height: 2.4vh; }
  @keyframes drift { from { transform: translateX(110vw); } to { transform: translateX(-30vh); } }
  .ground { position: fixed; left: 0; right: 0; bottom: 0; height: 10vh; z-index: 0;
    background:
      linear-gradient(var(--grass) 0 1.6vh, var(--grass-2) 1.6vh 2.4vh, transparent 2.4vh),
      linear-gradient(var(--dirt-2) .5vh, transparent .5vh) 0 2.4vh / 100% 3.8vh,
      linear-gradient(90deg, var(--dirt-2) .5vh, transparent .5vh) 0 2.4vh / 7.6vh 3.8vh,
      var(--dirt); }
  .stage { position: relative; z-index: 1; width: 100vw; height: 100vh; display: flex; flex-direction: column; padding: 3vh 3.4vw 11vh; }
  .sh { text-shadow: .45vh .45vh 0 var(--ink); }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 2vw; min-height: 6vh; }
  .event { font-weight: 700; font-size: 2.6vh; color: var(--white); text-shadow: .35vh .35vh 0 var(--ink); }
  .event small { display: block; font-weight: 400; font-size: 1.6vh; color: var(--gold); margin-top: .8vh; letter-spacing: .2em; }
  .qr { display: flex; align-items: center; gap: 1.2vw; background: var(--white); color: var(--ink); padding: 1vh 1.4vw 1vh 1vh;
    box-shadow: 0 0 0 .5vh var(--ink), .8vh .8vh 0 .5vh var(--ink); }
  .qr .code { width: 19vh; height: 19vh; background: #fff; padding: .4vh; }
  .qr .code img, .qr .code canvas { width: 100% !important; height: 100% !important; image-rendering: pixelated; display: block; }
  .qr .t1 { font-weight: 700; font-size: 2.4vh; }
  .qr .t2 { font-size: 1.6vh; color: #555; margin-top: .6vh; max-width: 18vw; word-break: break-all; }

  .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 0; }
  .fade { animation: popIn .5s steps(5) both; }
  @keyframes popIn { from { opacity: 0; transform: translateY(3vh); } to { opacity: 1; transform: none; } }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .label { font-size: 2.4vh; letter-spacing: .3em; color: var(--gold); text-shadow: .3vh .3vh 0 var(--ink); }
  .no { font-size: 3.2vh; color: var(--gold); margin-bottom: 2vh; text-shadow: .35vh .35vh 0 var(--ink); }
  .big-name { font-weight: 700; font-size: 12vh; line-height: 1.15; text-shadow: .9vh .9vh 0 var(--ink); }
  .song { font-size: 3.6vh; margin-top: 2.4vh; text-shadow: .35vh .35vh 0 var(--ink); }
  .song:empty { display: none; }
  .caption { margin-top: 5vh; font-size: 3vh; color: var(--white); text-shadow: .35vh .35vh 0 var(--ink); line-height: 1.6; }
  .big-qr { width: 34vh; height: 34vh; margin: 3vh auto 0; background: #fff; padding: 1.2vh; box-shadow: 0 0 0 .6vh var(--ink), 1vh 1vh 0 .6vh var(--ink); }
  .big-qr img, .big-qr canvas { width: 100% !important; height: 100% !important; display: block; image-rendering: pixelated; }

  /* 하트 블록 */
  .hblock { width: 18vh; height: 18vh; background: var(--block); display: grid; place-items: center; position: relative;
    box-shadow: inset -1.2vh -1.2vh 0 var(--block-2), inset 1.2vh 1.2vh 0 #fff2a8, 0 0 0 .6vh var(--ink); }
  .hblock::before, .hblock::after { content: ""; position: absolute; width: 1.4vh; height: 1.4vh; background: var(--block-2); top: 1.8vh; left: 1.8vh;
    box-shadow: 13vh 0 0 var(--block-2), 0 13vh 0 var(--block-2), 13vh 13vh 0 var(--block-2); }
  .hblock::after { display: none; }
  .hblock svg { width: 58%; }
  .pulse { margin: 4vh auto 3vh; animation: bump 1.2s steps(2) infinite; }
  @keyframes bump { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.4vh); } }
  .open-name { font-weight: 700; font-size: 7vh; text-shadow: .7vh .7vh 0 var(--ink); }
  .open-title { font-weight: 700; font-size: 5vh; color: var(--gold); text-shadow: .5vh .5vh 0 var(--ink); }
  .open-sub { font-size: 2.8vh; margin-top: 1.6vh; text-shadow: .3vh .3vh 0 var(--ink); }
  .open-sub b { color: var(--gold); }
  .joined { margin-top: 2.6vh; font-size: 2.4vh; background: var(--ink); display: inline-block; padding: .8vh 1.6vw; }
  .joined b { color: var(--gold); }

  /* 최종 결과 TOP 3 */
  .final { width: 100%; height: 100%; min-height: 0; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
  .f-head { text-align: center; flex: none; }
  .f-title { font-weight: 700; font-size: 7vh; margin-top: .6vh; line-height: 1.15; text-shadow: .7vh .7vh 0 var(--ink); }
  .f-title span { color: var(--gold); }
  .f-sub { font-size: 2.8vh; margin-top: 1vh; min-height: 3.4vh; text-shadow: .3vh .3vh 0 var(--ink); }
  .f-sub b { color: var(--gold); }
  .gauges { flex: 1 1 0; min-height: 0; width: 100%; display: flex; justify-content: center; align-items: stretch; gap: 8vw; padding: 2vh 0 0;
    opacity: 0; transition: opacity .6s steps(4); }
  .gauges.show { opacity: 1; }
  .g { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; min-height: 0; width: min(22vw, 30vh); }
  .g-badge { flex: none; height: 4.8vh; padding: 0 1.6vw; display: flex; align-items: center; font-weight: 700; font-size: 3vh;
    background: var(--white); color: var(--ink); box-shadow: 0 0 0 .4vh var(--ink); opacity: 0; transform: translateY(2vh); transition: transform .3s steps(3), opacity .3s steps(3); }
  .g.stopped .g-badge { opacity: 1; transform: none; }
  .g-clear { font-weight: 700; font-size: 2.6vh; color: var(--gold); text-shadow: .3vh .3vh 0 var(--ink); height: 3.4vh; visibility: hidden; }
  .g.winner .g-clear { visibility: visible; animation: blink .6s steps(1) infinite; }
  .g-num { font-weight: 700; font-size: 6.4vh; font-variant-numeric: tabular-nums; margin: 1vh 0 1.2vh; line-height: 1; text-shadow: .5vh .5vh 0 var(--ink); }
  .g-num small { font-size: .45em; margin-left: .3vw; }
  .g-tube { position: relative; width: 11vh; flex: 1 1 auto; min-height: 8vh; max-height: 44vh; display: flex; flex-direction: column-reverse; gap: .5vh;
    padding: .6vh; background: var(--ink); }
  .seg { flex: 1; background: #2b3266; }
  .seg.on { background: var(--block); box-shadow: inset -.6vh -.6vh 0 var(--block-2), inset .5vh .5vh 0 #fff2a8; }
  .g.winner .seg.on { background: var(--heart); box-shadow: inset -.6vh -.6vh 0 var(--heart-2), inset .5vh .5vh 0 #ffb3cd; }
  .g-name { margin-top: 2vh; font-weight: 700; font-size: 3.4vh; text-align: center; line-height: 1.2; text-shadow: .4vh .4vh 0 var(--ink); }
  .g-song { font-size: 2vh; margin-top: .6vh; text-align: center; min-height: 2.2vh; text-shadow: .25vh .25vh 0 var(--ink); }
  .g.winner .g-num { color: var(--gold); animation: jump .5s steps(2) 3; }
  .g.winner .g-badge { background: var(--gold); }
  @keyframes jump { 50% { transform: translateY(-2vh); } }
  .confetti { position: fixed; top: -4vh; width: 1.4vh; height: 1.4vh; z-index: 20; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translate(var(--dx), 112vh); } }

  /* 버튼·시작 안내 */
  .fs-btn, .snd-btn { position: fixed; bottom: 12px; z-index: 50; padding: 6px 12px; font-family: var(--px); font-size: 12px; cursor: pointer;
    background: var(--white); color: var(--ink); border: 3px solid var(--ink); }
  .fs-btn { right: 12px; opacity: 0; transition: opacity .3s; }
  body:hover .fs-btn { opacity: 1; }
  .snd-btn { right: 150px; background: var(--heart); color: #fff; }
  .snd-btn.on { background: var(--white); color: var(--ink); opacity: 0; }
  body:hover .snd-btn.on { opacity: 1; }
  .start-ov { position: fixed; inset: 0; z-index: 80; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vh;
    background: rgba(27,31,59,.75); transition: opacity .4s; }
  .start-ov.hide { opacity: 0; pointer-events: none; }
  .start-btn { display: flex; flex-direction: column; align-items: center; gap: 1.2vh; padding: 4vh 6vw; cursor: pointer; font-family: var(--px);
    background: var(--block); color: var(--ink); border: 0; box-shadow: inset -1vh -1vh 0 var(--block-2), inset 1vh 1vh 0 #fff2a8, 0 0 0 .6vh var(--ink); animation: bump 1.2s steps(2) infinite; }
  .start-btn b { font-size: 6vh; }
  .start-btn span { font-size: 2.6vh; }
  .start-ov p { color: #fff; font-size: 2vh; margin: 0; }
  .demo-badge { font-family: var(--px); background: var(--ink); color: var(--gold); border-radius: 0; }
</style>
</head>
<body>
<div class="sky">
  <div class="cloud" style="top:12vh;animation-duration:70s;animation-delay:-10s"><i></i><i></i><i></i></div>
  <div class="cloud" style="top:30vh;animation-duration:95s;animation-delay:-55s;transform:scale(.7)"><i></i><i></i><i></i></div>
  <div class="cloud" style="top:20vh;animation-duration:80s;animation-delay:-35s"><i></i><i></i><i></i></div>
</div>
<div class="ground"></div>
<div class="stage">
  <div class="top">
    <div class="event"><span id="eventTitle">감동 투표</span><small>SONG BATTLE</small></div>
    <div class="qr" id="qrBox">
      <div class="code" id="qr"></div>
      <div><div class="t1">휴대폰으로 투표 참여</div><div class="t2" id="qrUrl"></div></div>
    </div>
  </div>
  <div class="center" id="center"></div>
</div>
<div class="start-ov" id="startOv">
  <button class="start-btn" id="startBtn">
    <b>클릭해서 시작</b>
    <span>전체 화면 + 소리 켜기</span>
  </button>
  <p>브라우저 정책상 한 번 클릭해야 소리가 납니다 · F 전체 화면 · M 소리 끄기/켜기</p>
</div>
<button class="snd-btn" id="sndBtn">소리 꺼짐 · 클릭해서 켜기</button>
<button class="fs-btn" id="fsBtn">전체 화면 (F)</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-database-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/ranking.js"></script>
<script>
(async function () {
  const center = document.getElementById("center");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // ---------- 효과음 (Web Audio로 직접 합성 — 별도 음원 파일 없음)
  const SND = (() => {
    let ctx = null, out = null, muted = false;
    function ensure() {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
        const comp = ctx.createDynamicsCompressor();
        out = ctx.createGain(); out.gain.value = 0.9;
        out.connect(comp); comp.connect(ctx.destination);
      }
      if (ctx.state === "suspended") ctx.resume();
      return ctx;
    }
    const ready = () => ctx && ctx.state === "running" && !muted;
    function noiseBuffer(sec) {
      const b = ctx.createBuffer(1, ctx.sampleRate * sec, ctx.sampleRate), d = b.getChannelData(0);
      let last = 0;
      for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; last = (last + 0.04 * w) / 1.04; d[i] = last * 3.5; }
      return b;
    }
    // 게이지 상승음 (아케이드): 짧은 '뿅' 음이 아르페지오로 반복되며 점점 높고 빨라짐 + 8비트 드럼롤
    function riser() {
      if (!ready()) return { set() {}, stop() {} };
      let p = 0, stopped = false, step = 0, timer = null;
      const arp = [0, 4, 7, 12];                         // 도-미-솔-도
      const tick = () => {
        if (stopped) return;
        const at = ctx.currentTime + 0.02;
        const base = 130.81 * Math.pow(2, p * 2.6);      // 도(C3)에서 2옥타브 반 위까지 상승
        const semi = arp[step % 4] + Math.floor(step / 4) % 2 * 12 * (p > 0.6 ? 1 : 0);
        chip(base * Math.pow(2, semi / 12), at, 0.05, 0.25, 0.075);
        if (step % 4 === 0) chip(base / 2, at, 0.09, "tri", 0.22);       // 둥 (베이스)
        if (step % 2 === 1) noiseHit(at, 0.035, 0.05 + p * 0.09, 2500); // 따다닥 (드럼롤)
        step++;
        timer = setTimeout(tick, Math.max(42, 100 - p * 58));             // 진행될수록 빨라짐
      };
      tick();
      return {
        set(v) { p = v; },
        stop() { if (stopped) return; stopped = true; clearTimeout(timer); }
      };
    }
    // 순위 확정음 (아케이드): '띠-링' 두세 음 + 잡음
    function ding(rank) {
      if (!ready()) return;
      const t = ctx.currentTime + 0.01;
      const seq = rank === 1 ? [1318.5, 1568, 2093] : rank === 2 ? [1046.5, 1318.5] : [784, 1046.5];
      seq.forEach((fr, i) => {
        chip(fr, t + i * 0.07, i === seq.length - 1 ? 0.32 : 0.07, 0.5, 0.11);
        chip(fr * 1.006, t + i * 0.07 + 0.02, i === seq.length - 1 ? 0.28 : 0.06, 0.125, 0.04);
      });
      kick(t);
      noiseHit(t, 0.1, 0.16, 1800);
    }
    // 1위 축하곡: 아케이드(8비트 칩튠) 스타일 — 펄스파 멜로디 + 아르페지오 + 삼각파 베이스 + 잡음 드럼 → 코인 소리 → 박수
    let pulseCache = {};
    function pulseWave(duty) {
      if (pulseCache[duty]) return pulseCache[duty];
      const n = 64, re = new Float32Array(n), im = new Float32Array(n);
      for (let k = 1; k < n; k++) re[k] = (2 / (k * Math.PI)) * Math.sin(k * Math.PI * duty);
      return (pulseCache[duty] = ctx.createPeriodicWave(re, im));
    }
    function chip(fr, at, len, duty, vol, slideTo) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      if (duty === "tri") o.type = "triangle"; else o.setPeriodicWave(pulseWave(duty));
      o.frequency.setValueAtTime(fr, at);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, at + len);
      g.gain.setValueAtTime(vol, at);
      g.gain.setValueAtTime(vol, at + Math.max(0.01, len - 0.03));
      g.gain.linearRampToValueAtTime(0.0001, at + len);
      o.connect(g); g.connect(out); o.start(at); o.stop(at + len + 0.02);
    }
    function noiseHit(at, len, vol, hp) {
      const n = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
      const b = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * len), ctx.sampleRate), d = b.getChannelData(0);
      let v = 0; for (let i = 0; i < d.length; i++) { if (i % 6 === 0) v = Math.random() * 2 - 1; d[i] = v * Math.pow(1 - i / d.length, 2); } // 거친 8비트 잡음
      n.buffer = b; f.type = "highpass"; f.frequency.value = hp; g.gain.value = vol;
      n.connect(f); f.connect(g); g.connect(out); n.start(at);
    }
    function kick(at) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "square"; o.frequency.setValueAtTime(180, at); o.frequency.exponentialRampToValueAtTime(40, at + 0.12);
      g.gain.setValueAtTime(0.22, at); g.gain.exponentialRampToValueAtTime(0.0001, at + 0.14);
      o.connect(g); g.connect(out); o.start(at); o.stop(at + 0.16);
    }
    function fanfare() {
      if (!ready()) return;
      const B = 0.3;                         // 한 박 = 0.3초 (200 BPM)
      const N = (n) => 440 * Math.pow(2, ({ C: -9, D: -7, E: -5, F: -4, G: -2, A: 0, B: 2 }[n[0]] + (+n.slice(1) - 4) * 12) / 12);
      const t0 = ctx.currentTime + 0.1;

      // 시작: 파워업 효과음
      for (let i = 0; i < 8; i++) chip(N("C5") * Math.pow(2, i / 8 * 1.5), t0 + i * 0.035, 0.04, 0.25, 0.12);
      const s0 = t0 + 0.4;

      // 멜로디 [음, 박자] 8마디 (4/4)
      const mel = [
        ["C5", .5], ["E5", .5], ["G5", .5], ["C6", .5], ["B5", .5], ["G5", .5], ["E5", 1],
        ["G5", .5], ["A5", .5], ["G5", .5], ["E5", .5], ["C5", 1], ["E5", 1],
        ["F5", .5], ["A5", .5], ["C6", .5], ["A5", .5], ["F5", .5], ["A5", .5], ["C6", 1],
        ["B5", .5], ["A5", .5], ["G5", .5], ["F5", .5], ["D5", 1], ["G4", 1],
        ["A5", .5], ["C6", .5], ["E6", .5], ["C6", .5], ["A5", .5], ["G5", .5], ["E5", 1],
        ["F5", .5], ["G5", .5], ["A5", .5], ["C6", .5], ["A5", 1], ["F5", 1],
        ["G5", .5], ["G5", .5], ["G5", .5], ["A5", .5], ["B5", .5], ["B5", .5], ["D6", 1],
        ["C6", 1], ["G5", .5], ["E5", .5], ["C6", 2]];
      let tt = s0;
      mel.forEach(([n, beats], i) => {
        const len = beats * B, last = i === mel.length - 1;
        chip(N(n), tt, len * (last ? 1 : 0.9), 0.5, 0.11);             // 메인 멜로디 (사각파)
        chip(N(n) * 1.004, tt + 0.03, len * 0.8, 0.125, 0.035);         // 살짝 겹친 메아리
        tt += len;
      });

      // 반주: 마디별 화음 아르페지오 + 옥타브 베이스 + 드럼
      const chords = [["C4", "E4", "G4"], ["C4", "E4", "G4"], ["F4", "A4", "C5"], ["G4", "B4", "D5"],
                      ["A4", "C5", "E5"], ["F4", "A4", "C5"], ["G4", "B4", "D5"], ["C4", "E4", "G4"]];
      chords.forEach((ch, bar) => {
        const bs = s0 + bar * 4 * B, root = N(ch[0]) / 2;
        for (let k = 0; k < 16; k++) {                                   // 16분음표 아르페지오
          if (bar === 7 && k >= 8) break;
          chip(N(ch[k % 3]) * 2, bs + k * B / 4, B / 4 * 0.85, 0.25, 0.03);
        }
        for (let e = 0; e < 8; e++) {                                    // 8분음표 '둥-둥' 옥타브 베이스
          if (bar === 7 && e >= 4) break;
          chip(root * (e % 2 ? 2 : 1), bs + e * B / 2, B / 2 * 0.8, "tri", 0.3);
        }
        for (let q = 0; q < 4; q++) {                                    // 드럼: 쿵 칫 쿵 칫
          if (bar === 7 && q >= 2) break;
          const at = bs + q * B;
          if (q % 2 === 0) kick(at); else noiseHit(at, 0.12, 0.2, 1500);
          noiseHit(at + B / 2, 0.03, 0.08, 7000);
        }
      });
      const end = s0 + 8 * 4 * B - 2 * B;
      kick(end); noiseHit(end, 0.4, 0.18, 1200);                         // 마지막 '쾅'
      chip(N("C3"), end, 2 * B, "tri", 0.32);

      // 코인 효과음 + 반짝 상승 아르페지오
      const ce = end + 2 * B + 0.05;
      chip(N("B5"), ce, 0.07, 0.5, 0.1); chip(N("E6"), ce + 0.07, 0.35, 0.5, 0.1);
      ["C6", "E6", "G6", "C7", "E7", "G7"].forEach((n, i) => chip(N(n), ce + 0.45 + i * 0.045, 0.05, 0.25, 0.06));

      // 박수
      const clapBuf = (() => { const b = ctx.createBuffer(1, ctx.sampleRate * 0.06, ctx.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3); return b; })();
      const cs = end - 1.2, dur = 5.5;
      for (let i = 0; i < 460; i++) {
        const at = cs + Math.pow(Math.random(), 0.7) * dur;
        const sN = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
        sN.buffer = clapBuf; sN.playbackRate.value = 0.8 + Math.random() * 0.6;
        f.type = "bandpass"; f.frequency.value = 900 + Math.random() * 1800; f.Q.value = 1.2;
        const fadeIn = Math.min(1, (at - cs) / 1.2), fadeOut = 1 - Math.max(0, (at - cs - 3.2) / 2.3);
        g.gain.value = (0.06 + Math.random() * 0.08) * Math.max(0, Math.min(fadeIn, fadeOut));
        sN.connect(f); f.connect(g); g.connect(out); sN.start(at);
      }
    }
    return {
      unlock() { ensure(); return ctx && ctx.state === "running"; },
      get on() { return !!ctx && ctx.state === "running" && !muted; },
      toggle() { if (!ctx || ctx.state !== "running") { ensure(); muted = false; } else muted = !muted; },
      riser, ding, fanfare
    };
  })();

  const sndBtn = document.getElementById("sndBtn");
  function syncSnd() {
    setTimeout(() => {
      sndBtn.classList.toggle("on", SND.on);
      sndBtn.textContent = SND.on ? "소리 켜짐 (M)" : "소리 꺼짐 · 클릭해서 켜기";
    }, 120);
  }
  sndBtn.onclick = (e) => { e.stopPropagation(); SND.toggle(); syncSnd(); };
  // 시작 안내: 한 번 클릭하면 전체 화면 + 소리 켜기
  const startOv = document.getElementById("startOv");
  const hideStart = () => startOv.classList.add("hide");
  document.getElementById("startBtn").onclick = (e) => {
    e.stopPropagation();
    SND.unlock(); syncSnd();
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
    hideStart();
  };
  startOv.addEventListener("click", (e) => { if (e.target === startOv) { SND.unlock(); syncSnd(); hideStart(); } });
  // 브라우저가 이미 소리를 허용한 경우(사이트 설정 등)에는 안내를 띄우지 않음
  SND.unlock();
  setTimeout(() => { if (SND.on) { hideStart(); syncSnd(); } }, 400);
  // 브라우저 정책상 화면을 한 번 클릭하거나 키를 눌러야 소리가 납니다
  document.addEventListener("pointerdown", () => { if (!SND.on) { SND.unlock(); syncSnd(); } });
  document.addEventListener("keydown", (e) => {
    if (e.key === "m" || e.key === "M") { SND.toggle(); return syncSnd(); }
    if (!SND.on) { SND.unlock(); syncSnd(); }
    hideStart();
  });

  // 픽셀 하트 (7x6 칸)
  const HEART = (() => {
    const rows = [".##.##.", "#######", "#######", ".#####.", "..###..", "...#..."];
    let r = "";
    rows.forEach((row, y) => [...row].forEach((ch, x) => { if (ch === "#") r += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${y === 0 || (y === 1 && x < 2) ? "#ffb3cd" : y >= 4 || x === 6 ? "#b8205a" : "#ff4f8b"}"/>`; }));
    return `<svg viewBox="0 0 7 6" shape-rendering="crispEdges">${r}</svg>`;
  })();

  // 전체 화면
  const fs = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {});
  document.getElementById("fsBtn").onclick = fs;
  document.addEventListener("keydown", (e) => { if (e.key === "f" || e.key === "F") fs(); });

  // QR 코드
  const url = GD.voteUrl();
  document.getElementById("qrUrl").textContent = url.replace(/^https?:\/\//, "");
  try { new QRCode(document.getElementById("qr"), { text: url, width: 256, height: 256, correctLevel: QRCode.CorrectLevel.M }); } catch (e) {}

  await GD.init();

  let state = {}, contestants = {}, config = {}, presence = 0, lastKey = "", runId = 0;

  const isFinal = () => state.phase === "final" || state.phase === "ranking";

  GD.on("config", (c) => {
    config = c || {};
    document.getElementById("eventTitle").textContent = config.title || "감동 투표";
    document.title = (config.title || "감동 투표") + " · 무대 화면";
    renderQR();
    if (isFinal()) render();
  });
  GD.on("presence", (p) => {
    presence = p ? Object.keys(p).length : 0;
    const el = document.getElementById("joinedN");
    if (el) el.textContent = presence;
  });
  GD.on("contestants", (c) => { contestants = c || {}; render(); });
  GD.on("state", (s) => { state = s || {}; render(); });

  function renderQR() {
    const show = config.showQR !== false && state.phase && contestants[state.currentId] && !isFinal();
    document.getElementById("qrBox").style.visibility = show ? "visible" : "hidden";
  }

  function topThree() {
    return GDRank.ranked(contestants, config.rankBy).filter((x) => x.rank <= 3);
  }

  function render(force) {
    renderQR();
    const c = contestants[state.currentId];
    const key = isFinal()
      ? ["final", state.updatedAt, config.rankBy, JSON.stringify(topThree().map((x) => [x.id, x.result, x.name, x.song]))].join("|")
      : [state.phase, state.currentId, c && c.name, c && c.song].join("|");
    if (key === lastKey && !force) return;
    lastKey = key;
    runId++;

    if (isFinal()) return renderFinal();
    if (!c || !state.phase) {
      center.innerHTML = `<div class="fade"><div class="label">SONG BATTLE</div>
        <div class="big-name" style="font-size:9vh;margin-top:2.4vh">${esc(config.title || "감동 투표")}</div>
        <div class="caption blink" style="margin-top:3vh;color:var(--gold)">▶ QR코드를 찍고 입장하세요!</div>
        <div class="big-qr" id="bigQr"></div></div>`;
      try { new QRCode(document.getElementById("bigQr"), { text: url, width: 512, height: 512, correctLevel: QRCode.CorrectLevel.M }); } catch (e) {}
      document.getElementById("qrBox").style.visibility = "hidden";
      return;
    }
    const list = GDRank.ordered(contestants);
    const no = String(list.findIndex((x) => x.id === state.currentId) + 1).padStart(2, "0");

    if (state.phase === "ready") {
      center.innerHTML = `<div class="fade"><div class="no">PLAYER ${no}</div>
        <div class="big-name">${esc(c.name)}</div><div class="song">♪ ${esc(c.song)}</div>
        <div class="caption blink" style="color:var(--gold)">READY?</div></div>`;
    } else if (state.phase === "open") {
      center.innerHTML = `<div class="fade"><div class="open-name">${esc(c.name)}</div>
        <div class="pulse"><div class="hblock">${HEART}</div></div>
        <div class="open-title">감동 투표 중!</div>
        <div class="open-sub">감동받았다면 휴대폰의 <b>하트 블록</b>을 눌러 주세요</div>
        <div class="joined">접속한 관객 <b id="joinedN">${presence}</b>명</div></div>`;
    } else {
      // 마감 (예전 버전의 'revealed' 상태도 결과 없이 마감 화면으로 표시)
      center.innerHTML = `<div class="fade"><div class="no">PLAYER ${no}</div>
        <div class="big-name" style="font-size:9vh">${esc(c.name)}</div>
        <div class="open-title" style="margin-top:4vh">투표 마감!</div>
        <div class="caption" style="margin-top:2.4vh">감동을 전해 주셔서 감사합니다<br>결과는 모든 무대가 끝난 뒤 공개됩니다</div></div>`;
    }
  }

  // ---------- 최종 결과: TOP 3 게이지 연출 (4위 이하는 표시하지 않음)
  function renderFinal() {
    const my = runId;
    const top = topThree();
    if (!top.length) {
      center.innerHTML = `<div class="fade"><div class="f-title">최종 결과</div><div class="caption">아직 투표를 마친 무대가 없습니다</div></div>`;
      return;
    }
    const ratio = config.rankBy === "ratio";
    // 출연 순서대로 배치해서 위치만으로 순위가 드러나지 않게 함
    const cols = GDRank.ordered(contestants).map((c) => top.find((t) => t.id === c.id)).filter(Boolean);
    const val = (x) => (ratio ? Math.round(x.ratio * 100) : x.result);
    const unit = ratio ? "%" : "표";
    const max = Math.max(...cols.map(val), 1);
    const SEG = 12;                                   // 게이지 블록 칸 수

    center.innerHTML = `<div class="final">
      <div class="f-head fade"><div class="label">WORLD FINAL</div>
        <div class="f-title">최종 결과 <span>TOP ${Math.min(3, cols.length)}</span></div>
        <div class="f-sub" id="fSub">관객의 감동이 가장 컸던 무대는?</div></div>
      <div class="gauges" id="gauges">${cols.map((x, i) => `
        <div class="g" id="g${i}">
          <div class="g-clear">STAGE CLEAR!</div>
          <div class="g-badge" id="gb${i}"></div>
          <div class="g-num"><span id="gn${i}">0</span><small>${unit}</small></div>
          <div class="g-tube" id="gt${i}">${'<div class="seg"></div>'.repeat(SEG)}</div>
          <div class="g-name">${esc(x.name)}</div>
          <div class="g-song">${esc(x.song || "")}</div>
        </div>`).join("")}</div></div>`;

    setTimeout(() => { if (my === runId) document.getElementById("gauges").classList.add("show"); }, 1600);
    setTimeout(() => { if (my === runId) requestAnimationFrame(start); }, 3200);

    function start(t0) {
      const sound = SND.riser();
      const T = 6000 + Math.min(max, 200) * 25; // 표가 많을수록 조금 더 길게 (최대 약 11초)
      const ease = (p) => 1 - Math.pow(1 - p, 2.2);
      const done = cols.map(() => false);
      const step = (now) => {
        if (my !== runId) return sound.stop();
        const p = Math.min(1, (now - t0) / T);
        const shared = max * ease(p);
        sound.set(shared / max);
        cols.forEach((x, i) => {
          const target = val(x);
          const v = Math.min(target, shared);
          const lit = v <= 0 ? 0 : Math.max(1, Math.round((v / max) * SEG));
          const segs = document.getElementById("gt" + i).children;
          for (let k = 0; k < SEG; k++) segs[k].classList.toggle("on", k < lit);
          document.getElementById("gn" + i).textContent = Math.floor(v);
          if (!done[i] && (v >= target || p >= 1)) {
            done[i] = true;
            document.getElementById("gn" + i).textContent = target;
            document.getElementById("gb" + i).textContent = x.rank + "위";
            document.getElementById("g" + i).classList.add("stopped", "r" + x.rank);
            if (x.rank !== 1) SND.ding(x.rank);
          }
        });
        if (done.every(Boolean)) { sound.stop(); SND.ding(1); return finish(); }
        requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }

    function finish() {
      setTimeout(() => {
        if (my !== runId) return;
        cols.forEach((x, i) => x.rank === 1 && document.getElementById("g" + i).classList.add("winner"));
        const winners = cols.filter((x) => x.rank === 1).map((x) => x.name).join(", ");
        document.getElementById("fSub").innerHTML = `축하합니다! <b>${esc(winners)}</b>`;
        confetti();
        SND.fanfare();
      }, 700);
    }
  }

  function confetti() {
    const colors = ["#ffcf3a", "#ff4f8b", "#ffffff", "#5bd34a", "#1b1f3b"];
    for (let i = 0; i < 140; i++) {
      const d = document.createElement("div");
      d.className = "confetti";
      d.style.left = Math.random() * 100 + "vw";
      d.style.background = colors[i % colors.length];
      d.style.setProperty("--dx", (Math.random() - 0.5) * 30 + "vw");
      d.style.setProperty("--r", Math.random() * 1080 + "deg");
      d.style.animationDuration = 3 + Math.random() * 3 + "s";
      d.style.animationDelay = Math.random() * 1.2 + "s";
      document.body.appendChild(d);
      setTimeout(() => d.remove(), 8000);
    }
  }

  
})();
</script>
</body>
</html>
