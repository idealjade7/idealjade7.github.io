<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>무대 화면</title>
<link rel="stylesheet" href="css/common.css">
<style>
  html, body { overflow: hidden; }
  body { cursor: default; }
  .stage { position: relative; z-index: 1; width: 100vw; height: 100vh; display: flex; flex-direction: column; padding: 3.2vh 3.4vw; }

  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 2vw; min-height: 6vh; }
  .event { font-family: var(--serif); font-weight: 700; font-size: 2.6vh; color: var(--gold); letter-spacing: .03em; }
  .event small { display: block; font-family: var(--sans); font-weight: 500; font-size: 1.5vh; color: var(--muted); letter-spacing: .3em; margin-top: .6vh; }

  .qr { display: flex; align-items: center; gap: 1.2vw; background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 1.4vh; padding: 1vh 1.2vw 1vh 1vh; }
  .qr .code { width: 19vh; height: 19vh; background: #fff; border-radius: .8vh; padding: .7vh; }
  .qr .code img, .qr .code canvas { width: 100% !important; height: 100% !important; image-rendering: pixelated; display: block; }
  .qr .t1 { font-weight: 700; font-size: 2.6vh; }
  .qr .t2 { font-size: 1.7vh; color: var(--muted); margin-top: .5vh; max-width: 18vw; word-break: break-all; }

  .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 0; }
  .fade { animation: fadeUp .7s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(2vh); } to { opacity: 1; transform: none; } }

  .label { font-size: 2.2vh; letter-spacing: .4em; color: var(--muted); }
  .no { font-family: var(--serif); font-size: 3vh; color: var(--gold); margin-bottom: 1.5vh; letter-spacing: .1em; }
  .big-name { font-family: var(--serif); font-weight: 900; font-size: 13vh; line-height: 1.1; letter-spacing: -.01em; text-shadow: 0 0 6vh rgba(243,197,111,.25); }
  .song { font-size: 3.6vh; color: var(--ink-2); margin-top: 2vh; }
  .song:empty { display: none; }
  .caption { margin-top: 5vh; font-size: 2.6vh; color: var(--muted); }

  /* 투표 중 */
  .pulse { position: relative; width: 26vh; height: 26vh; margin: 4vh auto 3vh; display: grid; place-items: center; }
  .pulse::before, .pulse::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: .35vh solid var(--gold); opacity: 0; animation: ring 2.4s ease-out infinite; }
  .pulse::after { animation-delay: 1.2s; }
  @keyframes ring { 0% { transform: scale(.55); opacity: .9; } 100% { transform: scale(1.35); opacity: 0; } }
  .pulse .core { width: 14vh; height: 14vh; border-radius: 50%; display: grid; place-items: center; color: #3b2508;
    background: radial-gradient(circle at 50% 38%, #ffe7b5, var(--gold) 50%, #b9853a); box-shadow: 0 0 8vh rgba(243,197,111,.5); }
  .pulse .core svg { width: 45%; }
  .open-name { font-family: var(--serif); font-weight: 900; font-size: 7vh; }
  .open-title { font-size: 4.4vh; font-weight: 800; color: var(--gold-hi); }
  .open-sub { font-size: 2.6vh; color: var(--ink-2); margin-top: 1.4vh; }
  .joined { margin-top: 3vh; font-size: 2.2vh; color: var(--muted); }
  .joined b { color: var(--ink); font-variant-numeric: tabular-nums; }

  /* 집계 중 */
  .counting { font-family: var(--serif); font-size: 6vh; font-weight: 700; background: linear-gradient(90deg, var(--muted), var(--gold-hi), var(--muted)); background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 2s linear infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* 결과 공개 */
  .reveal { width: 100%; height: 100%; display: grid; grid-template-columns: 1fr 1.05fr; gap: 4vw; align-items: center; }
  .reveal .left { text-align: left; padding-left: 2vw; }
  .reveal .r-name { font-family: var(--serif); font-weight: 900; font-size: 7.5vh; line-height: 1.15; }
  .reveal .r-song { font-size: 2.8vh; color: var(--ink-2); margin-top: 1.2vh; }
  .reveal .r-song:empty { display: none; }
  .count-wrap { margin-top: 5vh; display: flex; align-items: baseline; gap: 1.4vw; }
  .count { font-family: var(--serif); font-weight: 900; font-size: 26vh; line-height: .9; color: var(--gold-hi); font-variant-numeric: tabular-nums; text-shadow: 0 0 8vh rgba(243,197,111,.45); }
  .count.final { animation: flash 1s ease; }
  @keyframes flash { 0% { transform: scale(1); } 30% { transform: scale(1.08); text-shadow: 0 0 14vh rgba(255,226,166,.9); } 100% { transform: scale(1); } }
  .of { font-size: 4vh; color: var(--muted); font-weight: 600; }
  .verdict { margin-top: 2.4vh; font-size: 3.4vh; color: var(--ink); opacity: 0; transition: opacity .8s; }
  .verdict.show { opacity: 1; }
  .verdict b { color: var(--gold-hi); }
  .rank-chip { display: inline-block; margin-top: 2.4vh; padding: 1vh 2vw; border-radius: 99px; font-size: 3vh; font-weight: 800;
    background: rgba(243,197,111,.14); border: 1px solid rgba(243,197,111,.45); color: var(--gold-hi); opacity: 0; transform: translateY(1vh); transition: .8s .4s; }
  .rank-chip.show { opacity: 1; transform: none; }

  .seats { position: relative; width: 100%; height: 72vh; display: grid; place-content: center; }
  .seats .grid { display: grid; gap: var(--gap); }
  .seat { width: var(--d); height: var(--d); border-radius: 50%; background: rgba(255,255,255,.07); transition: background .25s, box-shadow .25s, transform .25s; }
  .seat.on { background: var(--gold); box-shadow: 0 0 calc(var(--d) * .8) rgba(243,197,111,.75); transform: scale(1.08); }

  /* 순위표 */
  .ranking { width: min(1400px, 90vw); }
  .ranking h2 { font-family: var(--serif); font-size: 6vh; margin: 0 0 3.5vh; text-align: center; }
  .ranking h2 span { color: var(--gold); }
  .rows { display: flex; flex-direction: column; gap: var(--rgap, 1.4vh); }
  .row { display: grid; grid-template-columns: 9vh 1fr 34vw 15vh; align-items: center; gap: 2vw; padding: var(--rpad, 1.6vh) 2vw; border-radius: 1.6vh;
    background: rgba(255,255,255,.04); border: 1px solid var(--line); opacity: 0; animation: fadeUp .6s ease forwards; }
  .row.first { background: linear-gradient(90deg, rgba(243,197,111,.22), rgba(243,197,111,.05)); border-color: rgba(243,197,111,.5); }
  .row .rk { font-family: var(--serif); font-weight: 900; font-size: var(--rfs, 4.4vh); color: var(--muted); text-align: center; }
  .row.first .rk, .row.top .rk { color: var(--gold-hi); }
  .row .nm { font-weight: 800; font-size: var(--rfs, 4vh); text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .nm small { font-weight: 500; font-size: .55em; color: var(--muted); margin-left: 1vw; }
  .bar { height: 1.6vh; border-radius: 99px; background: rgba(255,255,255,.07); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--gold-lo), var(--gold)); transition: width 1.4s cubic-bezier(.2,.8,.2,1); }
  .row .sc { text-align: right; font-variant-numeric: tabular-nums; font-weight: 800; font-size: var(--rfs, 4vh); color: var(--gold-hi); }
  .row .sc small { display: block; font-size: .45em; color: var(--muted); font-weight: 500; }
  .big-qr { width: 34vh; height: 34vh; margin: 3vh auto 0; background: #fff; border-radius: 1.6vh; padding: 1.4vh; }
  .big-qr img, .big-qr canvas { width: 100% !important; height: 100% !important; display: block; image-rendering: pixelated; }
  .empty { color: var(--muted); font-size: 3vh; }


  /* 최종 결과 TOP 3 */
  .final { width: 100%; height: 100%; min-height: 0; display: flex; flex-direction: column; align-items: center; overflow: hidden; }
  .f-head { text-align: center; flex: none; }
  .f-title { font-family: var(--serif); font-weight: 900; font-size: 6.4vh; margin-top: .4vh; line-height: 1.15; }
  .f-title span { color: var(--gold); }
  .f-sub { font-size: 2.8vh; color: var(--ink-2); margin-top: .8vh; min-height: 3.4vh; }
  .f-sub b { color: var(--gold-hi); }
  .gauges { flex: 1 1 0; min-height: 0; width: 100%; display: flex; justify-content: center; align-items: stretch; gap: 7vw; padding: 2vh 0 1vh;
    opacity: 0; transform: translateY(3vh); transition: opacity .9s, transform .9s; }
  .gauges.show { opacity: 1; transform: none; }
  .g { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; min-height: 0; width: min(22vw, 30vh); }
  .g-badge { flex: none; height: 4.6vh; padding: 0 1.8vw; border-radius: 99px; display: flex; align-items: center; font-size: 2.8vh; font-weight: 900;
    background: rgba(243,197,111,.14); border: 1px solid rgba(243,197,111,.5); color: var(--gold-hi);
    opacity: 0; transform: scale(.4); transition: opacity .4s, transform .5s cubic-bezier(.2,1.7,.4,1); }
  .g.stopped .g-badge { opacity: 1; transform: none; }
  .g-num { font-family: var(--serif); font-weight: 900; font-size: 6.4vh; color: var(--gold-hi); font-variant-numeric: tabular-nums; margin: .8vh 0 1.2vh; line-height: 1; }
  .g-num small { font-size: .45em; margin-left: .3vw; color: var(--ink-2); }
  .g-tube { position: relative; width: 9vh; flex: 1 1 auto; min-height: 8vh; max-height: 42vh; border-radius: 99px; background: rgba(255,255,255,.06); border: 1px solid var(--line); overflow: hidden; transition: box-shadow .8s, border-color .8s; }
  .g-fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; border-radius: 99px;
    background: linear-gradient(0deg, var(--gold-lo), var(--gold) 65%, var(--gold-hi)); box-shadow: 0 0 4vh rgba(243,197,111,.55); }
  .g-name { margin-top: 2vh; font-family: var(--serif); font-weight: 900; font-size: 3.4vh; text-align: center; line-height: 1.2; }
  .g-song { font-size: 1.9vh; color: var(--muted); margin-top: .5vh; text-align: center; min-height: 2.2vh; }
  .g.winner .g-tube { border-color: var(--gold); box-shadow: 0 0 9vh rgba(255,226,166,.55); }
  .g.winner .g-badge { background: var(--gold); color: #2b1a05; font-size: 3.4vh; height: 5.4vh; }
  .g.winner .g-num { animation: flash 1.2s ease; }
  .confetti { position: fixed; top: -4vh; width: 1vh; height: 1.7vh; border-radius: 2px; z-index: 20; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translate(var(--dx), 112vh) rotate(var(--r)); } }

  .fs-btn { position: fixed; right: 12px; bottom: 12px; z-index: 50; background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; font-size: 12px; color: var(--muted); cursor: pointer; opacity: .0; transition: opacity .3s; }
  body:hover .fs-btn { opacity: 1; }
  .snd-btn { position: fixed; right: 140px; bottom: 12px; z-index: 50; border-radius: 99px; padding: 6px 12px; font-size: 12px; cursor: pointer;
    background: rgba(255,133,151,.14); border: 1px solid rgba(255,133,151,.5); color: var(--rose); transition: opacity .3s; }
  .snd-btn.on { background: rgba(255,255,255,.06); border-color: var(--line); color: var(--muted); opacity: 0; }
  body:hover .snd-btn.on { opacity: 1; }
</style>
</head>
<body>
<div class="spotlight"></div>
<div class="stage">
  <div class="top">
    <div class="event"><span id="eventTitle">감동 투표</span><small>VOICES THAT MOVE US</small></div>
    <div class="qr" id="qrBox">
      <div class="code" id="qr"></div>
      <div><div class="t1">휴대폰으로 투표 참여</div><div class="t2" id="qrUrl"></div></div>
    </div>
  </div>
  <div class="center" id="center"></div>
</div>
<button class="snd-btn" id="sndBtn">소리 꺼짐 · 클릭해서 켜기</button>
<button class="fs-btn" id="fsBtn">전체 화면 (F)</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-database-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/ranking.js"></script>
<script>
(async function () {
  const center = document.getElementById("center");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // ---------- 효과음 (Web Audio로 직접 합성 — 별도 음원 파일 없음)
  const SND = (() => {
    let ctx = null, out = null, muted = false;
    function ensure() {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
        const comp = ctx.createDynamicsCompressor();
        out = ctx.createGain(); out.gain.value = 0.9;
        out.connect(comp); comp.connect(ctx.destination);
      }
      if (ctx.state === "suspended") ctx.resume();
      return ctx;
    }
    const ready = () => ctx && ctx.state === "running" && !muted;
    function noiseBuffer(sec) {
      const b = ctx.createBuffer(1, ctx.sampleRate * sec, ctx.sampleRate), d = b.getChannelData(0);
      let last = 0;
      for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; last = (last + 0.04 * w) / 1.04; d[i] = last * 3.5; }
      return b;
    }
    // 게이지 상승음: 점점 높아지는 음 + 드럼롤
    function riser() {
      if (!ready()) return { set() {}, stop() {} };
      const t = ctx.currentTime;
      const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.16, t + 0.6); g.connect(out);
      const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 900; f.Q.value = 6; f.connect(g);
      const o1 = ctx.createOscillator(), o2 = ctx.createOscillator();
      o1.type = "sawtooth"; o2.type = "sawtooth"; o1.frequency.value = 110; o2.frequency.value = 110; o2.detune.value = 9;
      o1.connect(f); o2.connect(f); o1.start(); o2.start();
      const rg = ctx.createGain(); rg.gain.value = 0; rg.connect(out);
      const rf = ctx.createBiquadFilter(); rf.type = "bandpass"; rf.frequency.value = 180; rf.Q.value = 0.8; rf.connect(rg);
      const rn = ctx.createBufferSource(); rn.buffer = noiseBuffer(2); rn.loop = true; rn.connect(rf); rn.start();
      const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = 16; lg.gain.value = 0.22;
      lfo.connect(lg); lg.connect(rg.gain); lfo.start();
      let stopped = false;
      return {
        set(p) { // p: 0~1 진행도
          const now = ctx.currentTime, fr = 110 * Math.pow(2, p * 2.6);
          o1.frequency.setTargetAtTime(fr, now, 0.05); o2.frequency.setTargetAtTime(fr, now, 0.05);
          f.frequency.setTargetAtTime(700 + p * 3800, now, 0.05);
          lfo.frequency.setTargetAtTime(16 + p * 14, now, 0.1);
        },
        stop() {
          if (stopped) return; stopped = true;
          const now = ctx.currentTime;
          g.gain.cancelScheduledValues(now); g.gain.setTargetAtTime(0, now, 0.08); lg.gain.setTargetAtTime(0, now, 0.05);
          [o1, o2, rn, lfo].forEach((n) => n.stop(now + 0.6));
        }
      };
    }
    // 순위 확정 '딩'
    function ding(rank) {
      if (!ready()) return;
      const t = ctx.currentTime, base = rank === 1 ? 1046.5 : rank === 2 ? 880 : 784;
      [1, 2.01, 3.02].forEach((m, k) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sine"; o.frequency.value = base * m;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.28 / (k + 1), t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
        o.connect(g); g.connect(out); o.start(t); o.stop(t + 1.7);
      });
      const n = ctx.createBufferSource(), ng = ctx.createGain(), nf = ctx.createBiquadFilter();
      n.buffer = noiseBuffer(0.3); nf.type = "lowpass"; nf.frequency.value = 400;
      ng.gain.setValueAtTime(0.5, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
      n.connect(nf); nf.connect(ng); ng.connect(out); n.start(t);
    }
    // 축하 팡파르 + 박수
    function fanfare() {
      if (!ready()) return;
      const t = ctx.currentTime;
      const notes = [[523.25, 0, 0.18], [659.25, 0.18, 0.18], [783.99, 0.36, 0.18], [1046.5, 0.54, 1.6]];
      notes.forEach(([fr, at, len]) => [1, 1.5, 2].forEach((m, k) => {
        if (len < 1 && k) return;
        const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
        o.type = "sawtooth"; o.frequency.value = k === 1 ? fr * 0.75 : fr * (k === 2 ? 0.5 : 1);
        f.type = "lowpass"; f.frequency.value = 2600;
        g.gain.setValueAtTime(0.0001, t + at); g.gain.exponentialRampToValueAtTime(0.13, t + at + 0.03);
        g.gain.setValueAtTime(0.13, t + at + len * 0.7); g.gain.exponentialRampToValueAtTime(0.0001, t + at + len);
        o.connect(f); f.connect(g); g.connect(out); o.start(t + at); o.stop(t + at + len + 0.05);
      }));
      // 박수: 짧은 잡음 펄스를 무작위로 많이
      const clapBuf = (() => { const b = ctx.createBuffer(1, ctx.sampleRate * 0.06, ctx.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3); return b; })();
      const dur = 5.5;
      for (let i = 0; i < 420; i++) {
        const at = t + 0.4 + Math.pow(Math.random(), 0.8) * dur;
        const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
        s.buffer = clapBuf; s.playbackRate.value = 0.8 + Math.random() * 0.6;
        f.type = "bandpass"; f.frequency.value = 900 + Math.random() * 1800; f.Q.value = 1.2;
        const fade = 1 - Math.max(0, (at - t - 3.5) / 2.4);
        g.gain.value = (0.08 + Math.random() * 0.1) * Math.max(0, fade);
        s.connect(f); f.connect(g); g.connect(out); s.start(at);
      }
    }
    return {
      unlock() { ensure(); return ctx && ctx.state === "running"; },
      get on() { return !!ctx && ctx.state === "running" && !muted; },
      toggle() { if (!ctx || ctx.state !== "running") { ensure(); muted = false; } else muted = !muted; },
      riser, ding, fanfare
    };
  })();

  const sndBtn = document.getElementById("sndBtn");
  function syncSnd() {
    setTimeout(() => {
      sndBtn.classList.toggle("on", SND.on);
      sndBtn.textContent = SND.on ? "소리 켜짐 (M)" : "소리 꺼짐 · 클릭해서 켜기";
    }, 120);
  }
  sndBtn.onclick = (e) => { e.stopPropagation(); SND.toggle(); syncSnd(); };
  // 브라우저 정책상 화면을 한 번 클릭하거나 키를 눌러야 소리가 납니다
  document.addEventListener("pointerdown", () => { if (!SND.on) { SND.unlock(); syncSnd(); } });
  document.addEventListener("keydown", (e) => {
    if (e.key === "m" || e.key === "M") { SND.toggle(); return syncSnd(); }
    if (!SND.on) { SND.unlock(); syncSnd(); }
  });

  const HEART = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.1 4.4 2.4h1.6c.8-1.3 2.3-2.4 4.4-2.4 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>';

  // 전체 화면
  const fs = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {});
  document.getElementById("fsBtn").onclick = fs;
  document.addEventListener("keydown", (e) => { if (e.key === "f" || e.key === "F") fs(); });

  // QR 코드
  const url = GD.voteUrl();
  document.getElementById("qrUrl").textContent = url.replace(/^https?:\/\//, "");
  try { new QRCode(document.getElementById("qr"), { text: url, width: 256, height: 256, correctLevel: QRCode.CorrectLevel.M }); } catch (e) {}

  await GD.init();

  let state = {}, contestants = {}, config = {}, presence = 0, lastKey = "", runId = 0;

  const isFinal = () => state.phase === "final" || state.phase === "ranking";

  GD.on("config", (c) => {
    config = c || {};
    document.getElementById("eventTitle").textContent = config.title || "감동 투표";
    document.title = (config.title || "감동 투표") + " · 무대 화면";
    renderQR();
    if (isFinal()) render();
  });
  GD.on("presence", (p) => {
    presence = p ? Object.keys(p).length : 0;
    const el = document.getElementById("joinedN");
    if (el) el.textContent = presence;
  });
  GD.on("contestants", (c) => { contestants = c || {}; render(); });
  GD.on("state", (s) => { state = s || {}; render(); });

  function renderQR() {
    const show = config.showQR !== false && state.phase && contestants[state.currentId] && !isFinal();
    document.getElementById("qrBox").style.visibility = show ? "visible" : "hidden";
  }

  function topThree() {
    return GDRank.ranked(contestants, config.rankBy).filter((x) => x.rank <= 3);
  }

  function render(force) {
    renderQR();
    const c = contestants[state.currentId];
    const key = isFinal()
      ? ["final", state.updatedAt, config.rankBy, JSON.stringify(topThree().map((x) => [x.id, x.result, x.name, x.song]))].join("|")
      : [state.phase, state.currentId, c && c.name, c && c.song].join("|");
    if (key === lastKey && !force) return;
    lastKey = key;
    runId++;

    if (isFinal()) return renderFinal();
    if (!c || !state.phase) {
      center.innerHTML = `<div class="fade"><div class="label">PREPARING</div>
        <div class="big-name" style="font-size:10vh;margin-top:3vh">${esc(config.title || "감동 투표")}</div>
        <div class="caption">휴대폰 카메라로 QR코드를 찍어 투표 화면을 켜 두세요</div>
        <div class="big-qr" id="bigQr"></div></div>`;
      try { new QRCode(document.getElementById("bigQr"), { text: url, width: 512, height: 512, correctLevel: QRCode.CorrectLevel.M }); } catch (e) {}
      document.getElementById("qrBox").style.visibility = "hidden";
      return;
    }
    const list = GDRank.ordered(contestants);
    const no = String(list.findIndex((x) => x.id === state.currentId) + 1).padStart(2, "0");

    if (state.phase === "ready") {
      center.innerHTML = `<div class="fade"><div class="no">No. ${no}</div>
        <div class="big-name">${esc(c.name)}</div><div class="song">${esc(c.song)}</div>
        <div class="caption">곧 무대가 시작됩니다</div></div>`;
    } else if (state.phase === "open") {
      center.innerHTML = `<div class="fade"><div class="open-name">${esc(c.name)}</div>
        <div class="pulse"><div class="core">${HEART}</div></div>
        <div class="open-title">투표 진행 중</div>
        <div class="open-sub">감동받았다면 휴대폰의 <b style="color:var(--gold)">감동 받았어요</b> 버튼을 눌러 주세요</div>
        <div class="joined">접속한 관객 <b id="joinedN">${presence}</b>명</div></div>`;
    } else {
      // 마감 (예전 버전의 'revealed' 상태도 결과 없이 마감 화면으로 표시)
      center.innerHTML = `<div class="fade"><div class="no">No. ${no}</div>
        <div class="big-name" style="font-size:9vh">${esc(c.name)}</div>
        <div class="open-title" style="margin-top:4vh">투표 마감</div>
        <div class="caption" style="margin-top:2.4vh">감동을 전해 주셔서 감사합니다<br>결과는 모든 무대가 끝난 뒤 공개됩니다</div></div>`;
    }
  }

  // ---------- 최종 결과: TOP 3 게이지 연출 (4위 이하는 표시하지 않음)
  function renderFinal() {
    const my = runId;
    const top = topThree();
    if (!top.length) {
      center.innerHTML = `<div class="fade"><div class="f-title">최종 결과</div><div class="caption">아직 투표를 마친 무대가 없습니다</div></div>`;
      return;
    }
    const ratio = config.rankBy === "ratio";
    // 출연 순서대로 배치해서 위치만으로 순위가 드러나지 않게 함
    const cols = GDRank.ordered(contestants).map((c) => top.find((t) => t.id === c.id)).filter(Boolean);
    const val = (x) => (ratio ? Math.round(x.ratio * 100) : x.result);
    const unit = ratio ? "%" : "표";
    const max = Math.max(...cols.map(val), 1);

    center.innerHTML = `<div class="final">
      <div class="f-head fade"><div class="label">FINAL RESULT</div>
        <div class="f-title">최종 결과 <span>TOP ${Math.min(3, cols.length)}</span></div>
        <div class="f-sub" id="fSub">관객의 감동이 가장 컸던 무대는?</div></div>
      <div class="gauges" id="gauges">${cols.map((x, i) => `
        <div class="g" id="g${i}">
          <div class="g-badge" id="gb${i}"></div>
          <div class="g-num"><span id="gn${i}">0</span><small>${unit}</small></div>
          <div class="g-tube"><div class="g-fill" id="gf${i}"></div></div>
          <div class="g-name">${esc(x.name)}</div>
          <div class="g-song">${esc(x.song || "")}</div>
        </div>`).join("")}</div></div>`;

    setTimeout(() => { if (my === runId) document.getElementById("gauges").classList.add("show"); }, 1600);
    setTimeout(() => { if (my === runId) requestAnimationFrame(start); }, 3200);

    function start(t0) {
      const sound = SND.riser();
      const T = 6000 + Math.min(max, 200) * 25; // 표가 많을수록 조금 더 길게 (최대 약 11초)
      const ease = (p) => 1 - Math.pow(1 - p, 2.2);
      const done = cols.map(() => false);
      const step = (now) => {
        if (my !== runId) return sound.stop();
        const p = Math.min(1, (now - t0) / T);
        const shared = max * ease(p);
        sound.set(shared / max);
        cols.forEach((x, i) => {
          const target = val(x);
          const v = Math.min(target, shared);
          document.getElementById("gf" + i).style.height = (v / max) * 100 + "%";
          document.getElementById("gn" + i).textContent = Math.floor(v);
          if (!done[i] && (v >= target || p >= 1)) {
            done[i] = true;
            document.getElementById("gn" + i).textContent = target;
            document.getElementById("gb" + i).textContent = x.rank + "위";
            document.getElementById("g" + i).classList.add("stopped", "r" + x.rank);
            if (x.rank !== 1) SND.ding(x.rank);
          }
        });
        if (done.every(Boolean)) { sound.stop(); SND.ding(1); return finish(); }
        requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }

    function finish() {
      setTimeout(() => {
        if (my !== runId) return;
        cols.forEach((x, i) => x.rank === 1 && document.getElementById("g" + i).classList.add("winner"));
        const winners = cols.filter((x) => x.rank === 1).map((x) => x.name).join(", ");
        document.getElementById("fSub").innerHTML = `축하합니다! <b>${esc(winners)}</b>`;
        confetti();
        SND.fanfare();
      }, 700);
    }
  }

  function confetti() {
    const colors = ["#f3c56f", "#ffe2a6", "#ff8597", "#ffffff", "#c9a2ff"];
    for (let i = 0; i < 140; i++) {
      const d = document.createElement("div");
      d.className = "confetti";
      d.style.left = Math.random() * 100 + "vw";
      d.style.background = colors[i % colors.length];
      d.style.setProperty("--dx", (Math.random() - 0.5) * 30 + "vw");
      d.style.setProperty("--r", Math.random() * 1080 + "deg");
      d.style.animationDuration = 3 + Math.random() * 3 + "s";
      d.style.animationDelay = Math.random() * 1.2 + "s";
      document.body.appendChild(d);
      setTimeout(() => d.remove(), 8000);
    }
  }

  
})();
</script>
</body>
</html>
