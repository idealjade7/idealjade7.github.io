<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>무대 화면</title>
<link rel="stylesheet" href="css/common.css">
<style>
  html, body { overflow: hidden; }
  body { cursor: default; }
  .stage { position: relative; z-index: 1; width: 100vw; height: 100vh; display: flex; flex-direction: column; padding: 3.2vh 3.4vw; }

  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 2vw; min-height: 6vh; }
  .event { font-family: var(--serif); font-weight: 700; font-size: 2.6vh; color: var(--gold); letter-spacing: .03em; }
  .event small { display: block; font-family: var(--sans); font-weight: 500; font-size: 1.5vh; color: var(--muted); letter-spacing: .3em; margin-top: .6vh; }

  .qr { display: flex; align-items: center; gap: 1.2vw; background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 1.4vh; padding: 1vh 1.2vw 1vh 1vh; }
  .qr .code { width: 19vh; height: 19vh; background: #fff; border-radius: .8vh; padding: .7vh; }
  .qr .code img, .qr .code canvas { width: 100% !important; height: 100% !important; image-rendering: pixelated; display: block; }
  .qr .t1 { font-weight: 700; font-size: 2.6vh; }
  .qr .t2 { font-size: 1.7vh; color: var(--muted); margin-top: .5vh; max-width: 18vw; word-break: break-all; }

  .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 0; }
  .fade { animation: fadeUp .7s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(2vh); } to { opacity: 1; transform: none; } }

  .label { font-size: 2.2vh; letter-spacing: .4em; color: var(--muted); }
  .no { font-family: var(--serif); font-size: 3vh; color: var(--gold); margin-bottom: 1.5vh; letter-spacing: .1em; }
  .big-name { font-family: var(--serif); font-weight: 900; font-size: 13vh; line-height: 1.1; letter-spacing: -.01em; text-shadow: 0 0 6vh rgba(243,197,111,.25); }
  .song { font-size: 3.6vh; color: var(--ink-2); margin-top: 2vh; }
  .song:empty { display: none; }
  .caption { margin-top: 5vh; font-size: 2.6vh; color: var(--muted); }

  /* 투표 중 */
  .pulse { position: relative; width: 26vh; height: 26vh; margin: 4vh auto 3vh; display: grid; place-items: center; }
  .pulse::before, .pulse::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: .35vh solid var(--gold); opacity: 0; animation: ring 2.4s ease-out infinite; }
  .pulse::after { animation-delay: 1.2s; }
  @keyframes ring { 0% { transform: scale(.55); opacity: .9; } 100% { transform: scale(1.35); opacity: 0; } }
  .pulse .core { width: 14vh; height: 14vh; border-radius: 50%; display: grid; place-items: center; color: #3b2508;
    background: radial-gradient(circle at 50% 38%, #ffe7b5, var(--gold) 50%, #b9853a); box-shadow: 0 0 8vh rgba(243,197,111,.5); }
  .pulse .core svg { width: 45%; }
  .open-name { font-family: var(--serif); font-weight: 900; font-size: 7vh; }
  .open-title { font-size: 4.4vh; font-weight: 800; color: var(--gold-hi); }
  .open-sub { font-size: 2.6vh; color: var(--ink-2); margin-top: 1.4vh; }
  .joined { margin-top: 3vh; font-size: 2.2vh; color: var(--muted); }
  .joined b { color: var(--ink); font-variant-numeric: tabular-nums; }

  /* 집계 중 */
  .counting { font-family: var(--serif); font-size: 6vh; font-weight: 700; background: linear-gradient(90deg, var(--muted), var(--gold-hi), var(--muted)); background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 2s linear infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* 결과 공개 */
  .reveal { width: 100%; height: 100%; display: grid; grid-template-columns: 1fr 1.05fr; gap: 4vw; align-items: center; }
  .reveal .left { text-align: left; padding-left: 2vw; }
  .reveal .r-name { font-family: var(--serif); font-weight: 900; font-size: 7.5vh; line-height: 1.15; }
  .reveal .r-song { font-size: 2.8vh; color: var(--ink-2); margin-top: 1.2vh; }
  .reveal .r-song:empty { display: none; }
  .count-wrap { margin-top: 5vh; display: flex; align-items: baseline; gap: 1.4vw; }
  .count { font-family: var(--serif); font-weight: 900; font-size: 26vh; line-height: .9; color: var(--gold-hi); font-variant-numeric: tabular-nums; text-shadow: 0 0 8vh rgba(243,197,111,.45); }
  .count.final { animation: flash 1s ease; }
  @keyframes flash { 0% { transform: scale(1); } 30% { transform: scale(1.08); text-shadow: 0 0 14vh rgba(255,226,166,.9); } 100% { transform: scale(1); } }
  .of { font-size: 4vh; color: var(--muted); font-weight: 600; }
  .verdict { margin-top: 2.4vh; font-size: 3.4vh; color: var(--ink); opacity: 0; transition: opacity .8s; }
  .verdict.show { opacity: 1; }
  .verdict b { color: var(--gold-hi); }
  .rank-chip { display: inline-block; margin-top: 2.4vh; padding: 1vh 2vw; border-radius: 99px; font-size: 3vh; font-weight: 800;
    background: rgba(243,197,111,.14); border: 1px solid rgba(243,197,111,.45); color: var(--gold-hi); opacity: 0; transform: translateY(1vh); transition: .8s .4s; }
  .rank-chip.show { opacity: 1; transform: none; }

  .seats { position: relative; width: 100%; height: 72vh; display: grid; place-content: center; }
  .seats .grid { display: grid; gap: var(--gap); }
  .seat { width: var(--d); height: var(--d); border-radius: 50%; background: rgba(255,255,255,.07); transition: background .25s, box-shadow .25s, transform .25s; }
  .seat.on { background: var(--gold); box-shadow: 0 0 calc(var(--d) * .8) rgba(243,197,111,.75); transform: scale(1.08); }

  /* 순위표 */
  .ranking { width: min(1400px, 90vw); }
  .ranking h2 { font-family: var(--serif); font-size: 6vh; margin: 0 0 3.5vh; text-align: center; }
  .ranking h2 span { color: var(--gold); }
  .rows { display: flex; flex-direction: column; gap: var(--rgap, 1.4vh); }
  .row { display: grid; grid-template-columns: 9vh 1fr 34vw 15vh; align-items: center; gap: 2vw; padding: var(--rpad, 1.6vh) 2vw; border-radius: 1.6vh;
    background: rgba(255,255,255,.04); border: 1px solid var(--line); opacity: 0; animation: fadeUp .6s ease forwards; }
  .row.first { background: linear-gradient(90deg, rgba(243,197,111,.22), rgba(243,197,111,.05)); border-color: rgba(243,197,111,.5); }
  .row .rk { font-family: var(--serif); font-weight: 900; font-size: var(--rfs, 4.4vh); color: var(--muted); text-align: center; }
  .row.first .rk, .row.top .rk { color: var(--gold-hi); }
  .row .nm { font-weight: 800; font-size: var(--rfs, 4vh); text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .nm small { font-weight: 500; font-size: .55em; color: var(--muted); margin-left: 1vw; }
  .bar { height: 1.6vh; border-radius: 99px; background: rgba(255,255,255,.07); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--gold-lo), var(--gold)); transition: width 1.4s cubic-bezier(.2,.8,.2,1); }
  .row .sc { text-align: right; font-variant-numeric: tabular-nums; font-weight: 800; font-size: var(--rfs, 4vh); color: var(--gold-hi); }
  .row .sc small { display: block; font-size: .45em; color: var(--muted); font-weight: 500; }
  .big-qr { width: 34vh; height: 34vh; margin: 3vh auto 0; background: #fff; border-radius: 1.6vh; padding: 1.4vh; }
  .big-qr img, .big-qr canvas { width: 100% !important; height: 100% !important; display: block; image-rendering: pixelated; }
  .empty { color: var(--muted); font-size: 3vh; }

  .fs-btn { position: fixed; right: 12px; bottom: 12px; z-index: 50; background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; font-size: 12px; color: var(--muted); cursor: pointer; opacity: .0; transition: opacity .3s; }
  body:hover .fs-btn { opacity: 1; }
</style>
</head>
<body>
<div class="spotlight"></div>
<div class="stage">
  <div class="top">
    <div class="event"><span id="eventTitle">감동 투표</span><small>VOICES THAT MOVE US</small></div>
    <div class="qr" id="qrBox">
      <div class="code" id="qr"></div>
      <div><div class="t1">휴대폰으로 투표 참여</div><div class="t2" id="qrUrl"></div></div>
    </div>
  </div>
  <div class="center" id="center"></div>
</div>
<button class="fs-btn" id="fsBtn">전체 화면 (F)</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-database-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/ranking.js"></script>
<script>
(async function () {
  const center = document.getElementById("center");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const HEART = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.1 4.4 2.4h1.6c.8-1.3 2.3-2.4 4.4-2.4 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>';

  // 전체 화면
  const fs = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {});
  document.getElementById("fsBtn").onclick = fs;
  document.addEventListener("keydown", (e) => { if (e.key === "f" || e.key === "F") fs(); });

  // QR 코드
  const url = GD.voteUrl();
  document.getElementById("qrUrl").textContent = url.replace(/^https?:\/\//, "");
  try { new QRCode(document.getElementById("qr"), { text: url, width: 256, height: 256, correctLevel: QRCode.CorrectLevel.M }); } catch (e) {}

  await GD.init();

  let state = {}, contestants = {}, config = {}, presence = 0, lastKey = "", animTimer = null;

  GD.on("config", (c) => {
    config = c || {};
    document.getElementById("eventTitle").textContent = config.title || "감동 투표";
    document.title = (config.title || "감동 투표") + " · 무대 화면";
    renderQR();
    if (state.phase === "ranking") render(true);
  });
  GD.on("presence", (p) => {
    presence = p ? Object.keys(p).length : 0;
    const el = document.getElementById("joinedN");
    if (el) el.textContent = presence;
  });
  GD.on("contestants", (c) => { contestants = c || {}; render(); });
  GD.on("state", (s) => { state = s || {}; render(); });

  function renderQR() {
    const show = config.showQR !== false && state.phase && contestants[state.currentId] && state.phase !== "revealed" && state.phase !== "ranking";
    document.getElementById("qrBox").style.visibility = show ? "visible" : "hidden";
  }

  function render(force) {
    renderQR();
    const c = contestants[state.currentId];
    const key = [state.phase, state.currentId, c && c.revealedAt, c && c.name, c && c.song, state.phase === "ranking" ? JSON.stringify(contestants) : ""].join("|");
    if (key === lastKey && !force) return;
    lastKey = key;
    clearInterval(animTimer);

    if (state.phase === "ranking") return renderRanking();
    if (!c || !state.phase) {
      center.innerHTML = `<div class="fade"><div class="label">PREPARING</div>
        <div class="big-name" style="font-size:10vh;margin-top:3vh">${esc(config.title || "감동 투표")}</div>
        <div class="caption">휴대폰 카메라로 QR코드를 찍어 투표 화면을 켜 두세요</div>
        <div class="big-qr" id="bigQr"></div></div>`;
      try { new QRCode(document.getElementById("bigQr"), { text: url, width: 512, height: 512, correctLevel: QRCode.CorrectLevel.M }); } catch (e) {}
      document.getElementById("qrBox").style.visibility = "hidden";
      return;
    }
    const list = GDRank.ordered(contestants);
    const no = String(list.findIndex((x) => x.id === state.currentId) + 1).padStart(2, "0");

    if (state.phase === "ready") {
      center.innerHTML = `<div class="fade"><div class="no">No. ${no}</div>
        <div class="big-name">${esc(c.name)}</div><div class="song">${esc(c.song)}</div>
        <div class="caption">곧 무대가 시작됩니다</div></div>`;
    } else if (state.phase === "open") {
      center.innerHTML = `<div class="fade"><div class="open-name">${esc(c.name)}</div>
        <div class="pulse"><div class="core">${HEART}</div></div>
        <div class="open-title">투표 진행 중</div>
        <div class="open-sub">감동받았다면 휴대폰의 <b style="color:var(--gold)">감동 받았어요</b> 버튼을 눌러 주세요</div>
        <div class="joined">접속한 관객 <b id="joinedN">${presence}</b>명</div></div>`;
    } else if (state.phase === "closed") {
      center.innerHTML = `<div class="fade"><div class="no">No. ${no} · ${esc(c.name)}</div>
        <div class="counting">투표 마감 · 집계 중</div>
        <div class="caption">잠시 후 결과가 공개됩니다</div></div>`;
    } else if (state.phase === "revealed") {
      renderReveal(c);
    }
  }

  function renderReveal(c) {
    const result = c.result || 0, base = Math.max(c.base || 0, result);
    center.innerHTML = `<div class="reveal fade">
      <div class="left">
        <div class="label">감동한 관객</div>
        <div class="r-name" style="margin-top:2vh">${esc(c.name)}</div>
        <div class="r-song">${esc(c.song)}</div>
        <div class="count-wrap"><div class="count" id="cnt">0</div><div class="of">/ ${base}명</div></div>
        <div class="verdict" id="verdict">관객의 <b>${base ? Math.round((result / base) * 100) : 0}%</b>가 감동했습니다</div>
        <div class="rank-chip" id="rankChip"></div>
      </div>
      <div class="seats" id="seats"></div>
    </div>`;

    // 좌석(관객) 점 배치
    const seatsEl = document.getElementById("seats");
    const N = Math.min(base, 600) || 1;
    const scale = base > 600 ? 600 / base : 1;
    const W = seatsEl.clientWidth, H = seatsEl.clientHeight;
    const cols = Math.max(1, Math.ceil(Math.sqrt((N * W) / H)));
    const rows = Math.ceil(N / cols);
    const cell = Math.min(W / cols, H / rows, window.innerHeight * 0.075);
    const grid = document.createElement("div");
    grid.className = "grid";
    grid.style.gridTemplateColumns = `repeat(${cols}, ${cell * 0.74}px)`;
    grid.style.setProperty("--gap", cell * 0.26 + "px");
    grid.style.setProperty("--d", cell * 0.74 + "px");
    const seats = [];
    for (let i = 0; i < N; i++) { const d = document.createElement("div"); d.className = "seat"; grid.appendChild(d); seats.push(d); }
    seatsEl.appendChild(grid);
    // 무작위 순서로 불이 켜지도록 섞기
    let seed = [...(c.name || "x")].reduce((a, ch) => a + ch.charCodeAt(0), 7);
    const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);
    const order = seats.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }

    const cnt = document.getElementById("cnt");
    const dur = 5200, t0 = performance.now();
    const ease = (p) => 1 - Math.pow(1 - p, 3.2);
    let lit = 0;
    const step = (now) => {
      const p = Math.min(1, (now - t0) / dur);
      const v = Math.round(result * ease(p));
      cnt.textContent = v;
      const want = Math.round(v * scale);
      while (lit < want && lit < order.length) seats[order[lit++]].classList.add("on");
      if (p < 1 && state.phase === "revealed") requestAnimationFrame(step);
      else if (p >= 1) finish();
    };
    requestAnimationFrame(step);

    function finish() {
      cnt.textContent = result;
      cnt.classList.add("final");
      document.getElementById("verdict").classList.add("show");
      const rk = GDRank.rankOf(contestants, state.currentId, config.rankBy);
      const done = GDRank.ranked(contestants, config.rankBy).length;
      if (rk && done > 1) {
        const chip = document.getElementById("rankChip");
        chip.textContent = `현재 순위 ${rk}위 / ${done}명`;
        chip.classList.add("show");
      }
    }
  }

  function renderRanking() {
    const list = GDRank.ranked(contestants, config.rankBy);
    if (!list.length) {
      center.innerHTML = `<div class="ranking fade"><h2>현재 <span>순위</span></h2><div class="empty">아직 공개된 결과가 없습니다</div></div>`;
      return;
    }
    const n = list.length;
    const dense = n > 7;
    const style = dense ? `--rgap:${Math.max(.6, 8 / n)}vh;--rpad:${Math.max(.6, 9 / n)}vh;--rfs:${Math.max(2.2, 34 / n)}vh` : "";
    const max = Math.max(...list.map((x) => (config.rankBy === "ratio" ? x.ratio : x.result)), 1e-9);
    center.innerHTML = `<div class="ranking fade" style="${style}"><h2>현재 <span>순위</span></h2><div class="rows">${list.map((x, i) => `
      <div class="row ${x.rank === 1 ? "first" : x.rank <= 3 ? "top" : ""}" style="animation-delay:${(n - 1 - i) * 0.18}s">
        <div class="rk">${x.rank}</div>
        <div class="nm">${esc(x.name)}<small>${esc(x.song || "")}</small></div>
        <div class="bar"><i data-w="${((config.rankBy === "ratio" ? x.ratio : x.result) / max) * 100}"></i></div>
        <div class="sc">${config.rankBy === "ratio" ? Math.round(x.ratio * 100) + "%" : x.result + "명"}<small>${config.rankBy === "ratio" ? x.result + " / " + x.base + "명" : Math.round(x.ratio * 100) + "% · " + x.base + "명 중"}</small></div>
      </div>`).join("")}</div></div>`;
    setTimeout(() => center.querySelectorAll(".bar i").forEach((b) => (b.style.width = b.dataset.w + "%")), 300 + n * 180);
  }

  window.addEventListener("resize", () => render(true));
})();
</script>
</body>
</html>
