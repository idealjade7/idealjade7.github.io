<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>용해도 실험실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Share+Tech+Mono&display=swap">
<style>
/* 레이아웃: 화면 전체가 나무 실험대(3D), 위에 머리글·단계 탭, 오른쪽 설명란(입자 모형·그래프), 왼쪽 아래 조작 막대 */
:root{
  --bg:#1b1c1e; --ink:#f2f0ec; --ink2:#c6c3bd; --mute:#959189;
  --panel:rgba(25,26,28,.88); --panel2:rgba(255,255,255,.06); --line:rgba(255,255,255,.12);
  --accent:#6cc3e8; --cu:#3d8fe0; --kn:#f0b65e; --ok:#86d69c; --warn:#ff9a7a;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"Share Tech Mono",ui-monospace,Consolas,monospace;
  --pw:356px;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-50%);font-size:12px;font-weight:600;color:var(--ink);background:rgba(20,21,23,.76);border:1px solid var(--line);padding:2px 8px;border-radius:7px;white-space:nowrap;letter-spacing:.01em}
.lbl small{font-family:var(--mono);font-weight:400;color:var(--accent);margin-left:4px;font-size:12.5px}
.lbl.pop{font-size:14px;padding:4px 10px;border-color:transparent;background:#2f6b8f;animation:pop 1.8s ease forwards}
.lbl.card{font-weight:500;line-height:1.5;padding:7px 11px;text-align:left;background:rgba(16,17,19,.9);border-color:rgba(108,195,232,.5)}
.lbl.card b{font-family:var(--mono);color:var(--accent);font-size:14px;font-weight:400}
.lbl.two{white-space:nowrap;text-align:center;line-height:1.3;font-size:11.5px;padding:3px 7px}
.lbl.two b{font-size:13px;color:var(--accent)}
.lbl.temp{font-family:var(--mono);font-size:14px;font-weight:400;color:#ffb3a0;border-color:rgba(255,120,90,.4)}
@keyframes pop{0%{opacity:0;margin-top:8px}12%{opacity:1;margin-top:0}80%{opacity:1}100%{opacity:0;margin-top:-10px}}

header{position:fixed;left:0;right:0;top:0;padding:10px max(16px,env(safe-area-inset-left,0px)) 0;display:flex;align-items:center;gap:14px;z-index:5;pointer-events:none}
header>*{pointer-events:auto}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--ink2)}
.hbtns{margin-left:auto;display:flex;gap:8px}
.btn{font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;backdrop-filter:blur(8px);user-select:none;-webkit-user-select:none}
.btn:hover{border-color:rgba(108,195,232,.6)}
.btn:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.on{background:var(--accent);color:#0f2633;border-color:transparent}
#tabs{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:62px;display:flex;gap:6px;z-index:5;flex-wrap:wrap;max-width:calc(100vw - var(--pw) - 48px)}
body.embed #tabs{top:10px}
.tab{font:inherit;font-size:13.5px;font-weight:600;color:var(--ink2);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;backdrop-filter:blur(8px)}
.tab[aria-selected="true"]{background:var(--ink);color:#1b1c1e;border-color:transparent}
body.embed header{display:none}

#panel{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:12px;bottom:14px;width:var(--pw);background:var(--panel);border:1px solid var(--line);border-radius:16px;z-index:6;display:flex;flex-direction:column;backdrop-filter:blur(12px);transition:transform .35s ease,opacity .35s}
body:not(.embed) #panel{top:60px}
#panel.closed{transform:translateX(calc(100% + 30px));opacity:0;pointer-events:none}
.phead{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
.phead h2{margin:0;font-size:17px;font-weight:700;text-wrap:balance}
.phead .btn{margin-left:auto;padding:5px 10px;font-size:12px}
#pbody{overflow-y:auto;padding:0 16px 16px;display:flex;flex-direction:column;gap:12px;font-size:13.5px;line-height:1.6;color:var(--ink2)}
#pbody p{margin:0}
#pbody b{color:var(--ink)}
.mission{background:rgba(108,195,232,.09);border:1px solid rgba(108,195,232,.35);border-radius:12px;padding:10px 12px}
.mission h3{margin:0 0 6px;font-size:13px;color:var(--accent);letter-spacing:.04em}
.mission ol{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.mission li{position:relative;padding-left:22px}
.mission li::before{content:"";position:absolute;left:0;top:4px;width:14px;height:14px;box-sizing:border-box;border-radius:4px;border:1.5px solid var(--mute)}
.mission li.done{color:var(--ink)}
.mission li.done::before{background:var(--ok);border-color:var(--ok)}
.box{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.box.concl{border-color:rgba(134,214,156,.45);background:rgba(134,214,156,.08)}
.box.concl b{color:var(--ok)}
.note{font-size:11.5px;color:var(--mute);line-height:1.5}
table.rec{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
table.rec th{font-weight:600;color:var(--mute);text-align:right;padding:4px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
table.rec td{text-align:right;padding:5px 4px;border-bottom:1px solid rgba(255,255,255,.05);font-family:var(--mono);font-size:13.5px;color:var(--ink)}
table.rec th:first-child,table.rec td:first-child{text-align:left;font-family:var(--font);font-size:12.5px}
table.rec td.hl{color:var(--accent)}
canvas.chart{width:100%;height:auto;display:block;border-radius:10px;background:rgba(0,0,0,.22)}
.inset{position:relative}
.inset .cap{position:absolute;left:10px;top:7px;font-size:11.5px;color:var(--ink2);pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.read{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px}
.read span:nth-child(even){font-family:var(--mono);font-size:15px;color:var(--ink);text-align:right}
#pfoot{padding:8px 16px 12px;font-size:11px;color:var(--mute);border-top:1px solid var(--line)}
#popen{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:60px;z-index:6;display:none}
body.embed #popen{top:12px}
#popen.show{display:block}

#bar{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:5;flex-wrap:wrap;max-width:calc(100vw - var(--pw) - 50px)}
#credit{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));font-size:11px;color:rgba(242,240,236,.55);z-index:5;pointer-events:none}
#toast{position:fixed;left:calc((100vw - var(--pw)) / 2);top:110px;transform:translateX(-50%);background:rgba(16,17,19,.93);border:1px solid var(--line);color:var(--ink);padding:9px 16px;border-radius:12px;font-size:14px;z-index:8;opacity:0;transition:opacity .3s;pointer-events:none;max-width:min(540px,calc(100vw - 32px));text-align:center;line-height:1.5}
#toast.show{opacity:1}
body.embed #toast{top:56px}
#flash{position:fixed;inset:0;z-index:9;pointer-events:none;display:grid;place-items:center;opacity:0;background:radial-gradient(circle at center,rgba(170,225,255,.4),rgba(170,225,255,0) 60%)}
#flash span{font-size:64px;font-weight:700;color:#fff;text-shadow:0 4px 30px rgba(60,150,230,.85);transform:scale(.7)}
#flash.on{animation:fl 1.6s ease}
#flash.on span{animation:fs 1.6s ease}
@keyframes fl{0%{opacity:0}15%{opacity:1}70%{opacity:1}100%{opacity:0}}
@keyframes fs{0%{transform:scale(.6)}20%{transform:scale(1.08)}35%{transform:scale(1)}100%{transform:scale(1)}}

.modal{position:fixed;inset:0;z-index:20;background:rgba(8,9,10,.6);display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none!important}
.mcard{background:#222326;border:1px solid var(--line);border-radius:16px;max-width:560px;width:100%;max-height:86vh;overflow:auto;padding:18px 20px;color:var(--ink2);font-size:14px;line-height:1.6}
.mcard h2{margin:0 0 10px;color:var(--ink);font-size:18px;display:flex;align-items:center}
.mcard h2 .btn{margin-left:auto}
.q{border-top:1px solid var(--line);padding:12px 0}
.q p{margin:0 0 8px;color:var(--ink)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{font:inherit;font-size:13px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:6px 11px;cursor:pointer}
.opt.right{background:rgba(134,214,156,.2);border-color:var(--ok)}
.opt.wrong{background:rgba(255,154,122,.15);border-color:var(--warn)}
.exp{margin-top:8px;font-size:13px;color:var(--ink2)}
#qrbox{display:grid;place-items:center;padding:12px;background:#fff;border-radius:12px;width:max-content;margin:6px auto}
#qrurl{word-break:break-all;font-size:12px;text-align:center;color:var(--mute)}

@media (max-width:760px){
  :root{--pw:0px}
  .brand h1{font-size:18px}.brand span{display:none}
  #tabs{top:52px;max-width:calc(100vw - 32px);flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .tab{font-size:12.5px;padding:6px 11px;flex:none}
  #panel{left:10px;right:10px;width:auto;top:auto;bottom:10px;height:52vh;border-radius:16px}
  body:not(.embed) #panel{top:auto}
  #panel.closed{transform:translateY(calc(100% + 30px))}
  #popen{top:auto;bottom:calc(30px + env(safe-area-inset-bottom,0px));right:14px}
  body.embed #popen{top:auto}
  #bar{max-width:calc(100vw - 130px)}
  #toast{left:50%;top:96px}
  .btn{padding:7px 10px;font-size:12.5px}
}
@media (prefers-reduced-motion:reduce){#flash.on,#flash.on span,.lbl.pop{animation-duration:.01s}}
</style>

</head>
<body>
<div id="stage"></div>
<div id="labels"></div>
<header>
  <div class="brand"><h1>용해도 실험실</h1><span>중2 과학 Ⅰ. 물질의 특성 · 용해도와 재결정</span></div>
  <div class="hbtns"><button class="btn" id="bQuiz" type="button">확인 문제</button><button class="btn" id="bQR" type="button">QR</button></div>
</header>
<nav id="tabs" role="tablist"></nav>
<aside id="panel">
  <div class="phead"><h2 id="ptitle"></h2><button class="btn" id="pclose" type="button">접기</button></div>
  <div id="pbody"></div>
  <div id="pfoot">made by 한광여중 이상민</div>
</aside>
<button class="btn" id="popen" type="button">설명 보기</button>
<div id="bar"></div>
<div id="credit">made by 한광여중 이상민</div>
<div id="toast"></div>
<div id="flash"><span>성공!</span></div>
<div class="modal" id="mQuiz" hidden><div class="mcard"><h2>확인 문제 <button class="btn" data-close type="button">닫기</button></h2><div id="quiz"></div></div></div>
<div class="modal" id="mQR" hidden><div class="mcard" style="max-width:340px"><h2>휴대폰으로 열기 <button class="btn" data-close type="button">닫기</button></h2><div id="qrbox"></div><div id="qrurl"></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const V3=THREE.Vector3;
const params=new URLSearchParams(location.search);
const EMBED=params.get('embed')==='1';
if(EMBED) document.body.classList.add('embed');
const TABS=[
  {id:'A',name:'① 최대로 녹는 양'},
  {id:'B',name:'② 온도와 용해도'},
  {id:'C',name:'③ 재결정'},
  {id:'D',name:'④ 기체의 용해도'}
];
const SX={A:0,B:95,C:190,D:285};
const scParam=(params.get('sc')||'').toUpperCase();
let tab=SX[scParam]!==undefined?scParam:'A';
const isMobile=()=>innerWidth<=760;

/* ---------- 용해도 자료 (물 100 g에 녹는 최대 g, CRC Handbook) — 교과서 그림 5와 같음 ---------- */
const SOL={
  cu:{name:'황산 구리(Ⅱ)',short:'황산 구리',color:'#3d8fe0',hex:0x2f7fd6,crystal:0x2d74d0,t:[14.3,17.4,20.7,24.4,28.5,33.6,40.0,47.4,55.0,64.2,75.4]},
  kn:{name:'질산 칼륨',short:'질산 칼륨',color:'#b07cf0',hex:0xffffff,crystal:0xf4f4f0,t:[13.3,20.9,31.6,45.8,63.9,85.5,110,138,169,202,246]},
  nn:{name:'질산 나트륨',short:'질산 나트륨',color:'#f0a24e',hex:0xffffff,crystal:0xf6f3ea,t:[73,80,88,96,104,114,124,136,148,163,180]},
  na:{name:'염화 나트륨',short:'염화 나트륨',color:'#e8556a',hex:0xffffff,crystal:0xfbfbfb,t:[35.7,35.8,35.9,36.1,36.4,36.7,37.1,37.5,38.0,38.5,39.2]}
};
function S(k,T){const a=SOL[k].t;T=Math.max(0,Math.min(100,T));const i=Math.min(9,Math.floor(T/10));const f=(T-i*10)/10;return a[i]+(a[i+1]-a[i])*f;}
/* 이산화 탄소의 용해도(1기압, g/L) */
const CO2T=[[0,3.35],[5,2.77],[10,2.32],[20,1.69],[30,1.26],[40,.97],[50,.76],[60,.58],[80,.4]];
function co2s(T,P){let i=0;while(i<CO2T.length-2&&T>CO2T[i+1][0])i++;const [t0,s0]=CO2T[i],[t1,s1]=CO2T[i+1];const f=Math.max(0,Math.min(1,(T-t0)/(t1-t0)));return (s0+(s1-s0)*f)*P;}

/* ---------- 렌더러·장면 ---------- */
const stage=$('#stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.08;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x26272a);
scene.fog=new THREE.Fog(0x26272a,160,320);
const camera=new THREE.PerspectiveCamera(36,1,0.5,1200);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=0.08;controls.enablePan=false;
controls.minPolarAngle=0.2;controls.maxPolarAngle=1.45;controls.minDistance=12;controls.maxDistance=280;
controls.minAzimuthAngle=-1.15;controls.maxAzimuthAngle=1.15;controls.rotateSpeed=0.7;

function canvasTex(w,h,draw,srgb=true){
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);
  const t=new THREE.CanvasTexture(c);if(srgb)t.encoding=THREE.sRGBEncoding;t.anisotropy=renderer.capabilities.getMaxAnisotropy();t.userData={c,g,draw};return t;
}
function makeNoise(seed){
  const P=new Uint8Array(512);let s=seed||7;
  for(let i=0;i<256;i++)P[i]=i;
  for(let i=255;i>0;i--){s=(s*16807)%2147483647;const j=s%(i+1);[P[i],P[j]]=[P[j],P[i]];}
  for(let i=0;i<256;i++)P[i+256]=P[i];
  const R=new Float32Array(256);for(let i=0;i<256;i++){s=(s*16807)%2147483647;R[i]=s/2147483647;}
  const sm=t=>t*t*(3-2*t);
  return function(x,y,px,py){
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const x0=((xi%px)+px)%px,x1=(x0+1)%px,y0=((yi%py)+py)%py,y1=(y0+1)%py;
    const h=(a,b)=>R[P[(P[a&255]+b)&255]];
    const u=sm(xf),v=sm(yf);
    const a=h(x0,y0),b=h(x1,y0),c=h(x0,y1),d=h(x1,y1);
    return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
  };
}
function woodTexture(){
  const N=makeNoise(23);
  return canvasTex(1024,1024,(g,w,h)=>{
    const img=g.createImageData(w,h),d=img.data;
    for(let y=0;y<h;y++){
      const plank=Math.floor(y/256),py=y%256;
      for(let x=0;x<w;x++){
        const u=x/w,v=y/h;
        let n=0,a=1,f=1,tot=0;
        for(let o=0;o<3;o++){n+=a*N(u*3*f+plank*13.1,v*24*f,3*f,24*f);tot+=a;a*=.5;f*=2;}
        n/=tot;
        const grain=Math.sin((py/256*9+n*5.5+N(u*6,plank*3.3,6,4)*2)*Math.PI*2);
        let t=Math.pow(.5+.5*grain,2.2)*.55+N(u*40,v*180,40,180)*.25+n*.2;
        const seam=py<3||py>253?.55:1;
        const r=(150-t*62)*seam,gg=(98-t*44)*seam,b=(60-t*28)*seam;
        const i=(y*w+x)*4;d[i]=r;d[i+1]=gg;d[i+2]=b;d[i+3]=255;
      }
    }
    g.putImageData(img,0,0);
  });
}
function brushedTex(){
  return canvasTex(256,256,(g,w,h)=>{
    g.fillStyle='#888';g.fillRect(0,0,w,h);
    for(let i=0;i<900;i++){const y=Math.random()*h;const c=110+Math.random()*90|0;g.strokeStyle=`rgba(${c},${c},${c},.35)`;g.lineWidth=Math.random()*1.2+.3;g.beginPath();g.moveTo(0,y);g.lineTo(w,y+Math.random()*2-1);g.stroke();}
  },false);
}
function makeEnv(){
  const t=canvasTex(1024,512,(g,w,h)=>{
    const gr=g.createLinearGradient(0,0,0,h);
    gr.addColorStop(0,'#fbfcff');gr.addColorStop(.42,'#d6d8db');gr.addColorStop(.52,'#867f76');gr.addColorStop(1,'#2a2622');
    g.fillStyle=gr;g.fillRect(0,0,w,h);
    g.fillStyle='#ffffff';for(let i=0;i<4;i++)g.fillRect(70+i*250,120,130,105);
    g.fillStyle='rgba(250,252,255,.95)';g.fillRect(0,28,w,12);g.fillRect(0,70,w,6);
  });
  t.mapping=THREE.EquirectangularReflectionMapping;
  const pm=new THREE.PMREMGenerator(renderer);const env=pm.fromEquirectangular(t).texture;pm.dispose();return env;
}
scene.environment=makeEnv();
const hemi=new THREE.HemisphereLight(0xf6f4ef,0x3b2b1f,.55);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfffaf2,1.05);
sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-55,right:55,top:55,bottom:-55,near:10,far:200});
sun.shadow.bias=-0.0006;sun.shadow.radius=3;
scene.add(sun,sun.target);
const fill=new THREE.DirectionalLight(0xcfe2ff,.25);fill.position.set(-60,40,60);scene.add(fill);
function placeSun(sx){sun.position.set(sx+28,75,45);sun.target.position.set(sx,0,0);fill.position.set(sx-60,40,60);}

const woodMap=woodTexture();woodMap.wrapS=woodMap.wrapT=THREE.RepeatWrapping;woodMap.repeat.set(4.2,.75);

const tweens=[];
const easeIO=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeOut=t=>1-Math.pow(1-t,3);
function tween(dur,fn,done,ease){const tw={t:0,dur,fn,done,ease:ease||easeIO};tweens.push(tw);return tw;}
function updTweens(dt){
  for(let i=tweens.length-1;i>=0;i--){
    const tw=tweens[i];tw.t+=dt;const k=Math.min(1,tw.t/tw.dur);tw.fn(tw.ease(k));
    if(k>=1){tweens.splice(i,1);if(tw.done)tw.done();}
  }
}
function moveTo(obj,to,dur,arc,done){const from=obj.position.clone();return tween(dur,k=>{obj.position.lerpVectors(from,to,k);obj.position.y+=Math.sin(k*Math.PI)*(arc||0);},done);}

    g.font='bold 54px "IBM Plex Sans KR",sans-serif';g.textBaseline='middle';

/* 결정 더미(녹지 않고 남은 용질): 작은 결정 조각을 바닥에 쌓음 */
function makePile(parent,radius,maxN,size,needle){
  // needle: 질산 칼륨처럼 바늘 모양 결정
  const geo=needle?new THREE.BoxGeometry(size*.32,size*.32,size*2.2):new THREE.BoxGeometry(size,size*.7,size);
  const mat=new THREE.MeshPhysicalMaterial({color:0xffffff,roughness:.18,clearcoat:1,clearcoatRoughness:.1,metalness:0,envMapIntensity:1.4});
  const im=new THREE.InstancedMesh(geo,mat,maxN);im.count=0;im.castShadow=false;
  const d=new THREE.Object3D();let s=11;const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647;};
  for(let i=0;i<maxN;i++){
    const a=rnd()*Math.PI*2,r=Math.sqrt(rnd())*radius;const hgt=(1-r/radius)*size*Math.min(6,1+i/maxN*8)*.5;
    d.position.set(Math.cos(a)*r,size*.35+rnd()*hgt,Math.sin(a)*r);d.rotation.set(rnd()*3,rnd()*3,rnd()*3);d.updateMatrix();im.setMatrixAt(i,d.matrix);
  }
  im.instanceMatrix.needsUpdate=true;parent.add(im);
  return {im,mat,max:maxN,set(n,color){im.count=Math.max(0,Math.min(this.max,Math.round(n)));if(color!=null)mat.color.setHex(color);}};
}

const items=[];const zones=[];

function makeZone(o){

  const z=Object.assign({ring},o);zones.push(z);return z;
}
const ray=new THREE.Raycaster();const ndc=new THREE.Vector2();
const dragPlane=new THREE.Plane(new V3(0,1,0),0);
let drag=null;
function setNDC(e){const r=renderer.domElement.getBoundingClientRect();ndc.x=(e.clientX-r.left)/r.width*2-1;ndc.y=-(e.clientY-r.top)/r.height*2+1;}
function pickables(){const a=[];for(const it of items)if(it.station===tab&&!it.busy&&it.enabled!==false)a.push(it.hit);return a;}
let camAnim=null;
function onDown(e){
  if(e.button>0||camAnim)return;
  setNDC(e);ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects(pickables(),false);
  if(!hits.length)return;
  let it=hits[0].object.userData.item;
  e.stopPropagation();e.preventDefault();
  if(it.onClick){it.onClick(it);return;}
  if(it.spawn){it=it.spawn(it);if(!it)return;}
  if(it.rotate){drag={it,rot:true,last:screenAngle(e,it)};}
  else if(it.slide){drag={it,slide:true,lastY:e.clientY};}
  else{
    if(it.onPick)it.onPick(it);
    it.state='drag';
    const gy=it.grabY||0;dragPlane.constant=-(it.lift+gy);
    const p=new V3();const okp=ray.ray.intersectPlane(dragPlane,p);if(okp)p.y-=gy;
    drag={it,target:okp?p:it.mesh.position.clone(),s:[e.clientX,e.clientY],gy};
  }
  addEventListener('pointermove',onMove);addEventListener('pointerup',onUp);addEventListener('pointercancel',onUp);
}
function screenAngle(e,it){
  const p=new V3();it.rotCenter.getWorldPosition(p);p.project(camera);
  const r=renderer.domElement.getBoundingClientRect();
  const cx=(p.x+1)/2*r.width+r.left,cy=(1-p.y)/2*r.height+r.top;
  return Math.atan2(-(e.clientY-cy),e.clientX-cx);
}
function onMove(e){
  if(!drag)return;
  if(drag.rot){const a=screenAngle(e,drag.it);let d=a-drag.last;if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;drag.last=a;drag.it.rotate(d);return;}
  if(drag.slide){const dy=drag.lastY-e.clientY;drag.lastY=e.clientY;drag.it.slide(dy);return;}
  drag.s=[e.clientX,e.clientY];
  setNDC(e);ray.setFromCamera(ndc,camera);
  const p=new V3();if(ray.ray.intersectPlane(dragPlane,p)){p.y-=drag.gy||0;drag.target.copy(p);}
}
const _sp=new V3();
function toScreen(x,y,z){_sp.set(x,y,z).project(camera);return [(_sp.x+1)/2*innerWidth,(1-_sp.y)/2*innerHeight];}
function rectDist(s,z){
  if(!z.corners||z.dynamic){const b=new THREE.Box3().setFromObject(z.obj);z.corners=[];
    for(const x of [b.min.x,b.max.x])for(const y of [b.min.y,b.max.y])for(const zz of [b.min.z,b.max.z])z.corners.push(new V3(x,y,zz));}
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  for(const c of z.corners){const q=toScreen(c.x,c.y,c.z);x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1]);}
  return Math.hypot(Math.max(x0-s[0],0,s[0]-x1),Math.max(y0-s[1],0,s[1]-y1));
}
/* 손을 뗀 화면 위치에서 가장 가까운 기구로 들어감. 원래 자리가 더 가까우면 제자리로 */
function bestZone(it,s){
  if(!s)return null;
  const hp=it.homeAnchor||it.home;
  let best=null,bd=1e9;
  if(hp){const h=toScreen(hp.x,hp.y,hp.z);bd=Math.hypot(s[0]-h[0],s[1]-h[1]);}
  for(const z of zones){
    if(z.station!==tab||!z.accepts(it))continue;
    const d=rectDist(s,z);
    if(d<bd){bd=d;best=z;}
  }
  return best;
}
function onUp(){
  removeEventListener('pointermove',onMove);removeEventListener('pointerup',onUp);removeEventListener('pointercancel',onUp);
  if(!drag)return;const d=drag;drag=null;
  for(const z of zones)z.ring.material.opacity=0;
  if(d.rot){if(d.it.rotateEnd)d.it.rotateEnd();return;}
  if(d.slide){if(d.it.slideEnd)d.it.slideEnd();return;}
  const it=d.it;const z=bestZone(it,d.s);
  if(z)z.accept(it);else goHome(it);
}
function goHome(it){
  it.busy=true;it.state='moving';
  if(it.goHome){it.goHome(it);return;}
  moveTo(it.mesh,it.home,.45,3,()=>{it.busy=false;it.state='home';if(it.onHome)it.onHome(it);});
}
stage.addEventListener('pointerdown',onDown,true);
function updateDrag(){
  if(!drag||drag.rot||drag.slide)return;
  const m=drag.it.mesh;m.position.lerp(drag.target,.4);
  if(drag.it.onDragMove)drag.it.onDragMove(drag.s);
  const best=bestZone(drag.it,drag.s);
  for(const z of zones){
    if(z.station!==tab||!z.accepts(drag.it)){z.ring.material.opacity=0;continue;}
    if(z.dynamic){const o=z.obj.position;z.ring.position.set(o.x,o.y+(z.ringY||0),o.z);}
    z.ring.material.opacity=z===best?.95:.18;
  }
}

function pmCfg(){ // 각 탭이 현재 상태를 돌려줌
  if(tab==='A')return A.pm();
  if(tab==='B')return B.pm();
  if(tab==='C')return C.pm();
  return D.pm();
}
function drawPM(dt){
  const cv=document.getElementById('pmc');if(!cv)return;
  const g=cv.getContext('2d');const W=cv.width,H=cv.height;
  const cfg=pmCfg();PM.t+=dt;
  // 입자 목록 맞추기
  const want=[];
  cfg.groups.forEach(gr=>{for(let i=0;i<gr.n;i++)want.push(gr);});
  while(PM.parts.length<want.length)PM.parts.push({x:Math.random()*W,y:40+Math.random()*(H-80),vx:(Math.random()-.5)*60,vy:(Math.random()-.5)*60});
  PM.parts.length=want.length;
  g.clearRect(0,0,W,H);
  const top=cfg.top||34,bot=H-(cfg.solidH||0)-8;
  g.fillStyle=cfg.bg||'rgba(124,198,240,.13)';g.fillRect(0,top,W,H-top);
  g.strokeStyle='rgba(124,198,240,.4)';g.lineWidth=2;g.beginPath();g.moveTo(0,top);g.lineTo(W,top);g.stroke();
  const sp=cfg.speed||1;
  PM.parts.forEach((p,i)=>{
    const gr=want[i];
    p.vx+=(Math.random()-.5)*400*dt*sp;p.vy+=(Math.random()-.5)*400*dt*sp;
    const vmax=70*sp;const v=Math.hypot(p.vx,p.vy);if(v>vmax){p.vx*=vmax/v;p.vy*=vmax/v;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    const yMin=gr.air?6:top+gr.r+2,yMax=gr.air?top-gr.r-2:bot-gr.r;
    if(p.x<gr.r){p.x=gr.r;p.vx=Math.abs(p.vx);}if(p.x>W-gr.r){p.x=W-gr.r;p.vx=-Math.abs(p.vx);}
    if(p.y<yMin){p.y=yMin;p.vy=Math.abs(p.vy);}if(p.y>yMax){p.y=yMax;p.vy=-Math.abs(p.vy);}
    g.fillStyle=gr.c;g.beginPath();g.arc(p.x,p.y,gr.r,0,7);g.fill();
    if(gr.ring){g.strokeStyle=gr.ring;g.lineWidth=1.5;g.stroke();}
  });
  // 녹지 않은 고체(결정 격자)
  if(cfg.solid){
    cfg.solid.forEach((sd,si)=>{
      const n=sd.n;if(n<=0)return;const s=sd.r*2+1;const cols=Math.max(4,Math.round(Math.sqrt(n*2.2)));
      const x0=si===0?W*.5-cols*s/2:W*.75-cols*s/2;
      for(let i=0;i<n;i++){const cx=x0+(i%cols)*s+s/2,cy=H-6-Math.floor(i/cols)*s-s/2;g.fillStyle=sd.c;g.beginPath();g.arc(cx,cy,sd.r,0,7);g.fill();}
    });
  }
  // 기포
  if(cfg.bubbles){
    PM.bub=PM.bub||[];
    if(Math.random()<cfg.bubbles*dt)PM.bub.push({x:20+Math.random()*(W-40),y:bot,r:5+Math.random()*4});
    PM.bub.forEach(b=>{b.y-=60*dt;});PM.bub=PM.bub.filter(b=>b.y>top);
    PM.bub.forEach(b=>{g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=1.5;g.beginPath();g.arc(b.x,b.y,b.r,0,7);g.stroke();});
  }else PM.bub=[];
  const cap=document.getElementById('pmcap');if(cap&&cap.dataset.t!==cfg.cap){cap.textContent=cfg.cap;cap.dataset.t=cfg.cap;}
}

function selectTube(t){

  if(prev){moveTo(prev.g,prev.home,.5,3);}
  A.active=t;A.zone.obj=t.g;A.zone.dynamic=true;
  moveTo(t.g,A.holdPos.clone(),.6,4,()=>{A.busy=false;});
  // 용질 접시를 저울에 올리고 영점
  const k=t.c.k;
  for(const kk in A.dish){const d=A.dish[kk];if(kk===k)moveTo(d.g,A.scale.panPos.clone(),.6,3,()=>{A.scale.set((-t.added).toFixed(1).replace('-0.0','0.0'));});else moveTo(d.g,d.home.clone(),.6,3);}

A.spoon.onPick=()=>{if(!A.active)say('먼저 시험관대에서 시험관을 눌러 실험 자리로 가져와요.');};
A.spoon.onDragMove=s=>{

    A.spoonLoaded=true;A.pinch.visible=true;

A.spoon.goHome=x=>{A.spoonLoaded=false;A.pinch.visible=false;moveTo(x.mesh,x.home,.45,3,()=>{x.busy=false;x.state='home';x.mesh.rotation.x=0;});};
function spoonIn(sp){
  const t=A.active;if(!t){goHome(sp);return;}
  if(t.max!=null){say('이 시험관은 이미 포화 용액이 되었어요. 다른 조건의 시험관을 눌러 골라요.');goHome(sp);return;}
  if(!A.spoonLoaded){say('먼저 약숟가락을 <b>저울 위의 용질</b>에 가져가 떠요.');goHome(sp);return;}
  sp.busy=true;A.busy=true;
  const top=t.g.position.clone().add(new V3(-.4,12.4,0));
  moveTo(sp.mesh,top,.3,1,()=>{
    const r0=sp.mesh.rotation.x;
    tween(.25,k=>{sp.mesh.rotation.x=r0-k*1.4;},()=>{
      A.pinch.visible=false;A.spoonLoaded=false;addSolute(t,.1);
      tween(.25,k=>{sp.mesh.rotation.x=r0-1.4*(1-k);},()=>{A.busy=false;goHome(sp);});
    });
  });
}
function addSolute(t,g){
  t.added=+(t.added+g).toFixed(1);
  A.scale.set((-t.added).toFixed(1));
  // 흔들기
  const g0=t.g.rotation.z;tween(.5,k=>{t.g.rotation.z=Math.sin(k*Math.PI*6)*.08*(1-k);},()=>{t.g.rotation.z=0;});
  const cap=S(t.c.k,ROOM)*t.c.w/100;
  if(t.added>cap+1e-9&&t.max==null){
    t.max=+(t.added-.1).toFixed(1);A.rec[t.c.id]=t.max;
    setTimeout(()=>{
      say(`녹지 않고 바닥에 남았어요. 저울이 <b>-${t.added.toFixed(1)} g</b>이니 최대로 녹은 양은 <b>${t.max.toFixed(1)} g</b>이에요.`,4200);
      A.card.el.innerHTML=`${t.c.id} 물 ${t.c.w} g에 최대 <b>${t.max.toFixed(1)} g</b><br>물 1 g당 <b>${(t.max/t.c.w).toFixed(2)} g</b>`;A.card.visible=true;
      refreshA();
    },450);
  }
  refreshA();
}
A.step=function(dt){

    t.pile.set(und*120,SOL[t.c.k].crystal);
    if(t.c.k==='cu'){const f=Math.min(1,dis/cap);t.lm.color.setRGB(.87-.7*f,.94-.42*f,.98-.15*f);t.lm.opacity=.42+.25*f;}
  }

};
A.pm=function(){

  const cap=S(t.c.k,ROOM)*t.c.w/100;const dis=Math.min(t.added,cap),und=Math.max(0,t.added-cap);
  const col=t.c.k==='cu'?'#3d8fe0':'#f0b65e';
  const ns=Math.round(dis/t.c.w*90);
  return {cap:`${t.c.id}: 물 ${t.c.w} g + ${SOL[t.c.k].short} ${t.added.toFixed(1)} g`,

    solid:[{n:Math.round(und*60),c:col,r:5}],solidH:und>0?20:0};

D.step=function(dt){
  // 펌프: 손잡이를 끝까지 올렸다 내리면 한 번 공기를 뺌
  D.pg.position.y=D.pgY+D.hPos*3.2;
  if(D.hPos<.12)D.armed=true;
  if(D.armed&&D.hPos>.88){D.armed=false;D.P=Math.max(.25,D.P*.8);D.strokes++;D.airLife=1;
    const pos=D.air.geometry.attributes.position;const o=new V3();D.pg.getWorldPosition(o);D.airV=[];
    for(let i=0;i<40;i++){pos.setXYZ(i,o.x+(Math.random()-.5)*.6,o.y-1.2+Math.random()*.5,o.z+(Math.random()-.5)*.6);D.airV.push(new V3((Math.random()-.2)*6,2+Math.random()*4,(Math.random()-.5)*3));}
    pos.needsUpdate=true;
    if(D.strokes===1)say('펌프질을 하면 용기 속 <b>공기가 빠져나가</b> 압력이 낮아져요.',3600);
    refreshD();}
  if(D.airLife>0){D.airLife-=dt;const pos=D.air.geometry.attributes.position;for(let i=0;i<40;i++){pos.setXYZ(i,pos.getX(i)+D.airV[i].x*dt,pos.getY(i)+D.airV[i].y*dt,pos.getZ(i)+D.airV[i].z*dt);}pos.needsUpdate=true;D.air.material.opacity=Math.max(0,D.airLife)*.9;}
  D.pLbl.el.textContent=`${D.P.toFixed(2)} 기압`;
  if(D.lastP!==D.P){drawGauge(D.P);D.lastP=D.P;}
  // 기체 용해도와 기포
  D.em.forEach((e,i)=>{
    e.T+=(e.bath-e.T)*Math.min(1,dt/3);
    const P=i===0?D.P:1;const s=co2s(e.T,P);
    const ex=Math.max(0,e.c-s);
    e.rate=Math.min(150,ex*ex*14);
    e.c=Math.max(s,e.c-ex*.005*dt);
    if(e.tube)e.tube.tl.el.textContent=`${e.T.toFixed(0)} ℃`;
    const moving=e.tube&&e.tube.it.state!=='home';
    e.acc+=moving?0:e.rate*dt;
    while(e.acc>=1&&D.bubs.length<600){e.acc-=1;const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*e.rad;D.bubs.push({e,x:e.x()+Math.cos(a)*r,z:e.z()+Math.sin(a)*r,y:e.bottom+Math.random()*1.5,top:e.surf(),v:2.5+Math.random()*3,s:.1+Math.random()*.1});}
    if(e.acc>1)e.acc=1;
  });
  const d=new THREE.Object3D();let n=0;
  D.bubs=D.bubs.filter(b=>{if(b.e.tube&&b.e.tube.it.state!=='home')return false;b.y+=b.v*dt;b.v+=4*dt;b.s=Math.min(.28,b.s+.04*dt);return b.y<b.top-.05;});
  for(const b of D.bubs){d.position.set(b.x,b.y,b.z);d.scale.setScalar(b.s);d.updateMatrix();D.bubIM.setMatrixAt(n++,d.matrix);}
  D.bubIM.count=n;D.bubIM.instanceMatrix.needsUpdate=true;
  // 김
  D.steam.forEach(st=>{st.t+=dt*.35;if(st.t>1)st.t-=1;st.s.position.set(SX.D+14+1.8+Math.sin(st.t*7)*.8,9+st.t*7,-4);st.s.material.opacity=Math.sin(st.t*Math.PI)*.35;st.s.scale.setScalar(2+st.t*3);});
  // 관찰 판정
  if(D.P<=.55&&!D.seen.jar){D.seen.jar=true;say('압력이 낮아지자 기포가 훨씬 많이 생겨요. 기체의 용해도가 작아졌기 때문이에요.',4200);refreshD();}
  const tIce=D.places.ice.tube,tHot=D.places.hot.tube;
  const iceOk=tIce&&D.em[tIce.n].T<8,hotOk=tHot&&D.em[tHot.n].T>45;
  if(!D.done&&D.seen.jar&&iceOk&&hotOk){D.done=true;celebrate();say('압력이 낮을수록, 온도가 높을수록 기체의 용해도가 작아져요!');refreshD();}
  D.readT=(D.readT||0)+dt;if(D.readT>.2){D.readT=0;updReadD();}
};

  D.places.ice.tube=null;D.places.hot.tube=null;

function drawCurves(id,pts,showAll){
  const cv=document.getElementById(id);if(!cv)return;const g=cv.getContext('2d');
  g.clearRect(0,0,cv.width,cv.height);
  const L=70,R=cv.width-20,T=22,Bt=cv.height-56;const X=t=>L+(R-L)*t/100,Y=v=>Bt-(Bt-T)*Math.min(v,160)/160;
  g.strokeStyle='rgba(255,255,255,.08)';g.lineWidth=1;g.fillStyle='#959189';g.font='21px "IBM Plex Sans KR",sans-serif';
  for(let t=0;t<=100;t+=20){g.beginPath();g.moveTo(X(t),T);g.lineTo(X(t),Bt);g.stroke();g.textAlign='center';g.fillText(t,X(t),Bt+26);}
  for(let v=0;v<=160;v+=40){g.beginPath();g.moveTo(L,Y(v));g.lineTo(R,Y(v));g.stroke();g.textAlign='right';g.fillText(v,L-8,Y(v)+7);}
  g.textAlign='center';g.fillText('온도(℃)',(L+R)/2,cv.height-6);
  g.save();g.translate(18,(T+Bt)/2);g.rotate(-Math.PI/2);g.fillText('용해도(g/물 100 g)',0,0);g.restore();
  const keys=showAll?Object.keys(SOL):pts.map(p=>p.k);
  keys.forEach(k=>{
    const on=pts.some(p=>p.k===k);
    g.strokeStyle=SOL[k].color;g.globalAlpha=on?1:.28;g.lineWidth=on?3.5:2;g.beginPath();
    for(let t=0;t<=100;t+=1){const v=S(k,t);if(v>160){break;}t?g.lineTo(X(t),Y(v)):g.moveTo(X(t),Y(v));}
    g.stroke();g.globalAlpha=1;
  });
  pts.forEach(p=>{
    const v=Math.min(p.v,S(p.k,p.T)+ (p.und>0?0:0));
    const y=Y(Math.min(p.v,160));
    // 넣은 양(가로 점선)
    g.setLineDash([6,6]);g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=1.5;g.beginPath();g.moveTo(L,Y(p.v));g.lineTo(R,Y(p.v));g.stroke();g.setLineDash([]);
    const dis=Math.min(p.v,S(p.k,p.T));
    g.fillStyle=SOL[p.k].color;g.beginPath();g.arc(X(p.T),Y(dis),10,0,7);g.fill();g.strokeStyle='#fff';g.lineWidth=2.5;g.stroke();
    if(p.und>.3){g.strokeStyle=SOL[p.k].color;g.lineWidth=3;g.beginPath();g.moveTo(X(p.T),Y(dis)-12);g.lineTo(X(p.T),Y(p.v)+4);g.stroke();
      g.fillStyle='#f2f0ec';g.font='19px "IBM Plex Sans KR",sans-serif';g.textAlign='left';g.fillText(`석출·남음 ${p.und.toFixed(1)} g`,Math.min(X(p.T)+14,R-170),(Y(dis)+Y(p.v))/2+6);}
  });
}

const VIEWS={
  A:{t:[-3,6,3],d:[0,.55,.84],w:26,h:13},
  B:{t:[3,6,3],d:[0,.5,.87],w:21,h:14},
  C:{t:[0,12,1],d:[0,.36,.93],w:24,h:17.5},
  D:{t:[2,9.5,3],d:[0,.38,.92],w:22,h:15}
};
function viewFor(id){
  const v=VIEWS[id];const sx=SX[id];
  const target=new V3(sx+v.t[0],v.t[1],v.t[2]);
  const dir=new V3(...v.d);if(innerWidth<innerHeight)dir.y+=.35;dir.normalize();
  const W=innerWidth,H=innerHeight;const pw=panelUsed();
  const eff=(W-pw)/H;const tv=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  let d=Math.max(v.h/tv,v.w/(tv*eff));
  return {target,pos:target.clone().addScaledVector(dir,d)};
}
function goView(id,instant){
  const v=viewFor(id);
  if(instant){camera.position.copy(v.pos);controls.target.copy(v.target);controls.update();return;}
  const p0=camera.position.clone(),t0=controls.target.clone();controls.enabled=false;
  camAnim=tween(1.25,k=>{camera.position.lerpVectors(p0,v.pos,k);camera.position.y+=Math.sin(k*Math.PI)*6;controls.target.lerpVectors(t0,v.target,k);camera.lookAt(controls.target);},()=>{camAnim=null;controls.enabled=true;controls.update();});
}
function panelUsed(){return (!isMobile()&&!$('#panel').classList.contains('closed'))?parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--pw'))+28:0;}
function resize(){
  const W=innerWidth,H=innerHeight;renderer.setSize(W,H);camera.aspect=W/H;
  const off=panelUsed()/2;
  if(off>0)camera.setViewOffset(W,H,off,24,W,H);else camera.setViewOffset(W,H,0,isMobile()?-10:24,W,H);
  camera.updateProjectionMatrix();
}

      ${PMBOX}
      <div class="box concl" id="conclB" hidden></div>
      <p class="note">점은 지금 녹아 있는 양, 점선은 넣은 양이에요. 점이 곡선 위에 있으면 포화 용액, 곡선 아래에 있으면 불포화 용액이에요. 온도 변화는 보기 쉽게 빠르게 했어요.</p>`;
    refreshB();
  }else if(tab==='C'){
    h.textContent='재결정으로 순수한 고체 얻기';
    pbody.innerHTML=`
      <p>염화 나트륨 20 g과 질산 칼륨 60 g이 섞인 혼합물을 물 100 g에 넣었어요. 질산 칼륨만 따로 얻어 보아요.</p>
      <div class="mission"><h3>해 보기</h3><ol>
        <li id="mC1">핫플레이트로 50 ℃까지 가열해 모두 녹이기</li>
        <li id="mC2">비커를 찬물 수조로 끌어 20 ℃로 식히기</li>
        <li id="mC3">비커를 거름 장치로 끌어 걸러 내기</li></ol></div>
      <canvas class="chart" id="chartC" width="640" height="440"></canvas>
      <div class="legend"><span><i style="background:${SOL.kn.color}"></i>질산 칼륨</span><span><i style="background:${SOL.na.color}"></i>염화 나트륨</span></div>
      <div class="box read" id="readC"></div>
      ${PMBOX}
      <div class="box concl" id="conclC" hidden></div>
      <p class="note">용해도(물 100 g): 질산 칼륨 50 ℃ 85.5 g · 20 ℃ 31.6 g, 염화 나트륨 50 ℃ 36.7 g · 20 ℃ 35.9 g(CRC Handbook). 교과서 표(84 g, 32 g)와 조금 달라 석출량이 약 28 g으로 같아요.</p>`;
    refreshC();
  }else{
    h.textContent='압력과 온도에 따른 기체의 용해도';
    pbody.innerHTML=`
      <p>탄산음료에는 이산화 탄소가 녹아 있어요. 압력과 온도를 바꾸면 기포가 어떻게 달라질까요?</p>
      <div class="mission"><h3>해 보기</h3><ol>
        <li id="mD1">펌프 손잡이를 위아래로 끌어 압력을 0.55 기압 아래로 낮추기</li>
        <li id="mD2">시험관대의 탄산음료 시험관 하나를 끌어 <b>얼음물</b>에 담그기</li>
        <li id="mD3">다른 시험관을 끌어 <b>뜨거운 물</b>에 담그고 기포 비교하기</li></ol></div>
      ${PMBOX}
      <div class="box read" id="readD"></div>
      <div class="box">펌프질을 하면 용기 안에 공기를 넣는 것이 아니라 <b>공기가 빠져나가</b> 압력이 낮아져요. 빨간 밸브를 누르면 공기가 다시 들어가요.</div>
      <div class="box concl" id="conclD" hidden></div>
      <p class="note">이산화 탄소 용해도(1 기압): 5 ℃ 2.8 g/L, 20 ℃ 1.7 g/L, 60 ℃ 0.6 g/L. 기포가 생기는 빠르기는 보기 쉽게 과장했어요. 입자 모형에서 흰 알갱이가 녹아 있는 이산화 탄소예요.</p>`;
    refreshD();
  }
}
function refreshA(){
  const tb=$('#recA');if(!tb)return;
  tb.innerHTML=COND.map(c=>{const m=A.rec[c.id];const t=A.tubes.find(x=>x.c.id===c.id);
    return `<tr><td>${c.id} ${SOL[c.k].short}</td><td>${c.w}</td><td class="${m!=null?'hl':''}">${m!=null?m.toFixed(1):(t&&t.added>0?'…':'–')}</td><td>${m!=null?(m/c.w).toFixed(2):'–'}</td></tr>`;}).join('');
  const n=COND.filter(c=>A.rec[c.id]!=null).length;
  mark('mA1',!!A.active);mark('mA2',A.tubes.some(t=>t.added>0));mark('mA3',n===4);$('#cntA').textContent=`(${n}/4)`;
  const c=$('#conclA');
  const same=['cu','kn'].some(k=>COND.filter(x=>x.k===k).every(x=>A.rec[x.id]!=null));
  const diff=A.rec.A!=null&&A.rec.C!=null||A.rec.B!=null&&A.rec.D!=null;
  if(same||diff){c.hidden=false;let s='';
    if(same)s+='용질의 종류가 같으면 물 1 g당 최대로 녹는 양이 <b>거의 같아요</b>. 물의 양이 2배가 되면 녹는 양도 약 2배예요.';
    if(diff)s+=(s?'<br>':'')+'같은 양의 물이라도 용질의 종류가 다르면 최대로 녹는 양이 <b>달라요</b>.';
    if(n===4)s+='<br>그래서 일정한 온도에서 용매 100 g에 최대로 녹는 용질의 양, 즉 <b>용해도</b>는 물질의 특성이에요.';
    c.innerHTML=s;}else c.hidden=true;
  if(n===4&&!A.done){A.done=true;celebrate();say('조건 A~D를 모두 쟀어요!');}
}
function updReadB(und){
  const el=$('#readB');if(!el)return;
  const sat=und>.05||Math.abs(B.dis-S(B.k,B.T))<.3;
  el.innerHTML=`<span>현재 온도</span><span>${B.T.toFixed(1)} ℃</span><span>이 온도의 용해도</span><span>${S(B.k,B.T).toFixed(1)} g</span><span>녹아 있는 양</span><span>${B.dis.toFixed(1)} g</span><span>녹지 않은 양</span><span>${und.toFixed(1)} g</span><span>용액</span><span>${sat?'포화 용액':'불포화 용액'}</span>`;
}
function refreshB(){
  // 해 보기 ①② 는 한 번이라도 해 보면 체크 유지, ③ 은 물질별 진행 상황 표시
  const ks=Object.keys(SOL);
  mark('mB1',ks.some(k=>B.seen[k]&&B.seen[k].melt));mark('mB2',ks.some(k=>B.seen[k]&&B.seen[k].cryst));
  const n=ks.filter(k=>B.seen[k]&&B.seen[k].melt&&B.seen[k].cryst).length;
  mark('mB3',n===4);const ce=$('#cntB');if(ce)ce.textContent=`(${n}/4)`;
  const st=$('#stB');
  if(st)st.innerHTML=ks.map(k=>{const s=B.seen[k]||{};const cur=k===B.k;
    return `<span style="color:${SOL[k].color};${cur?'font-weight:700':''}">${SOL[k].short} ${s.melt?'녹임✓':'녹임·'} ${s.cryst?'석출✓':'석출·'}</span>`;}).join('<br>');
  const c=$('#conclB');if(!c)return;
  if(n>=2){c.hidden=false;c.innerHTML='고체의 용해도는 일반적으로 <b>온도가 높을수록 커져요</b>. 온도에 따라 용해도가 변하는 정도는 물질마다 달라서, <b>질산 칼륨</b>이 가장 크고 <b>염화 나트륨</b>이 가장 작아요.';}else c.hidden=true;
}
function updReadC(){
  const el=$('#readC');if(!el)return;
  const undK=Math.max(0,C.kn-C.disKn);
  el.innerHTML=C.filtered?`<span>거름종이 위 (질산 칼륨)</span><span>${(C.filterKn||0).toFixed(1)} g</span><span>거른 용액 속 염화 나트륨</span><span>${C.na.toFixed(1)} g</span><span>거른 용액 속 질산 칼륨</span><span>${(C.kn-(C.filterKn||0)).toFixed(1)} g</span>`
   :`<span>현재 온도</span><span>${C.T.toFixed(1)} ℃</span><span>녹아 있는 염화 나트륨</span><span>${C.disNa.toFixed(1)} / 20 g</span><span>녹아 있는 질산 칼륨</span><span>${C.disKn.toFixed(1)} / 60 g</span><span>바닥의 고체</span><span>${undK.toFixed(1)} g</span>`;
}
function refreshC(){
  mark('mC1',C.stage>=1);mark('mC2',C.stage>=2);mark('mC3',C.done);
  const c=$('#conclC');if(!c)return;
  if(C.stage>=2||C.done){c.hidden=false;c.innerHTML='질산 칼륨은 온도에 따른 용해도 차가 커서 식히면 <b>석출</b>되지만, 염화 나트륨은 20 ℃에서도 용해도(35.9 g)보다 적게 녹아 있어서 석출되지 않아요. 이렇게 고체 혼합물을 모두 녹인 뒤 냉각해 순도 높은 고체를 얻는 방법이 <b>재결정</b>이에요.';}else c.hidden=true;
}
function updReadD(){
  const el=$('#readD');if(!el)return;
  el.innerHTML=D.em.map(e=>`<span>${e.name}</span><span>${e.rate<18?'기포 적음':e.rate<80?'기포 보통':'기포 많음'}</span>`).join('')+`<span>감압 용기 압력</span><span>${D.P.toFixed(2)} 기압</span>`;
}
function refreshD(){
  mark('mD1',D.seen.jar);mark('mD2',D.seen.ice);mark('mD3',D.seen.hot);
  const c=$('#conclD');if(!c)return;
  if(D.seen.jar&&(D.seen.ice||D.seen.hot)){c.hidden=false;c.innerHTML='기체의 용해도는 주위 <b>압력이 낮을수록</b>, <b>온도가 높을수록</b> 작아져요. 그래서 녹아 있던 이산화 탄소가 빠져나와 기포가 많이 생겨요. 탄산음료는 마개를 꼭 닫아 차갑게 보관해요.';}else c.hidden=true;
}

/* ---------- 확인 문제·QR ---------- */
const QUIZ=[
  {q:'20 ℃에서 물 5 g에 황산 구리(Ⅱ)가 최대 1.0 g 녹았어요. 같은 온도에서 물 10 g에는 최대 몇 g 녹을까요?',o:['1.0 g','약 2.0 g','약 0.5 g'],a:1,e:'용질의 종류와 온도가 같으면 물의 양에 비례해서 녹아요.'},
  {q:'포화 용액에 용질을 더 넣으면 어떻게 될까요?',o:['과포화 용액이 된다','녹지 않고 바닥에 가라앉는다','용액의 농도가 계속 진해진다'],a:1,e:'더 넣은 용질은 녹지 못하고 가라앉으며, 용액 부분은 여전히 포화 용액이에요.'},
  {q:'온도에 따라 용해도가 변하는 정도가 가장 작은 물질은?',o:['질산 칼륨','황산 구리(Ⅱ)','염화 나트륨'],a:2,e:'염화 나트륨의 용해도 곡선은 거의 수평이에요.'},
  {q:'염화 나트륨 20 g과 질산 칼륨 60 g을 50 ℃ 물 100 g에 모두 녹인 뒤 20 ℃로 식히면 석출되는 것은?',o:['염화 나트륨','질산 칼륨','둘 다'],a:1,e:'20 ℃에서 질산 칼륨 용해도(약 32 g)보다 많이 녹아 있던 질산 칼륨만 석출돼요.'},
  {q:'탄산음료의 김이 덜 빠지게 보관하려면?',o:['뚜껑을 열고 따뜻한 곳에','뚜껑을 닫고 차가운 곳에','뚜껑을 닫고 따뜻한 곳에'],a:1,e:'기체의 용해도는 압력이 높을수록, 온도가 낮을수록 커요.'}
];
function buildQuiz(){
  const box=$('#quiz');
  box.innerHTML=QUIZ.map((q,i)=>`<div class="q"><p>${i+1}. ${q.q}</p><div class="opts">${q.o.map((o,j)=>`<button class="opt" type="button" data-q="${i}" data-j="${j}">${o}</button>`).join('')}</div><div class="exp" id="exp${i}" hidden></div></div>`).join('');
  box.onclick=e=>{const b=e.target.closest('.opt');if(!b)return;const i=+b.dataset.q,j=+b.dataset.j;const q=QUIZ[i];
    b.parentElement.querySelectorAll('.opt').forEach(x=>x.classList.remove('right','wrong'));
    b.classList.add(j===q.a?'right':'wrong');const ex=$('#exp'+i);ex.hidden=false;ex.innerHTML=(j===q.a?'<b style="color:var(--ok)">정답!</b> '+q.e:'<b style="color:var(--warn)">다시 생각해 보세요.</b>');};
}
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m||e.target.hasAttribute('data-close'))m.hidden=true;}));
$('#bQuiz').onclick=()=>{$('#mQuiz').hidden=false;};
$('#bQR').onclick=()=>{
  const u=new URL(location.href);u.searchParams.delete('embed');u.searchParams.set('sc',tab);
  const s=u.toString();$('#qrurl').textContent=s;$('#qrbox').innerHTML='';
  try{new QRCode($('#qrbox'),{text:s,width:220,height:220,correctLevel:QRCode.CorrectLevel.M});}catch(e){$('#qrbox').textContent='QR을 만들 수 없어요.';}
  $('#mQR').hidden=false;
};
$('#pclose').onclick=()=>{$('#panel').classList.add('closed');$('#popen').classList.add('show');resize();};
$('#popen').onclick=()=>{$('#panel').classList.remove('closed');$('#popen').classList.remove('show');resize();};

/* ---------- 반복 ---------- */
const clock=new THREE.Clock();
function frame(){
  const dt=Math.min(.05,clock.getDelta());
  updTweens(dt);updateDrag();
  ({A,B,C,D})[tab].step(dt);
  drawPM(dt);
  if(!camAnim)controls.update();
  renderer.render(scene,camera);updateLabels();
  requestAnimationFrame(frame);
}
buildTabs();buildQuiz();
if(isMobile()){$('#panel').classList.add('closed');$('#popen').classList.add('show');}
resize();
setTab(tab,true);
addEventListener('resize',()=>{resize();if(!camAnim)goView(tab,true);});
if(document.fonts&&document.fonts.load){document.fonts.load('60px "Share Tech Mono"').then(()=>A.scale.set('0.0')).catch(()=>{});}
drawGauge(1);
frame();
window.__app={THREE,scene,camera,controls,A,B,C,D,items,zones,setTab,S,co2s,get tab(){return tab;}};
})();
</script>
